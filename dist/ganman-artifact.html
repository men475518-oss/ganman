  var LIST = [
    { key: 'cut',  Ctor: CutMan },
    { key: 'elec', Ctor: ElecMan },
    { key: 'ice',  Ctor: IceMan },
    { key: 'fire', Ctor: FireMan },
    { key: 'bomb', Ctor: BombMan },
    { key: 'guts', Ctor: GutsMan }
  ];
  var BY_KEY = {};
  LIST.forEach(function (b) { BY_KEY[b.key] = b; b.def = b.Ctor.def; });

  function create(key, x, y) {
    var e = BY_KEY[key];
    return e ? new e.Ctor(x, y) : null;
  }

  /* 2色を混ぜる（クリア済みの顔を「色味は残しつつ暗く」するのに使う） */
  function mix(hex, hex2, t) {
    function p(h) {
      return [parseInt(h.substr(1, 2), 16), parseInt(h.substr(3, 2), 16), parseInt(h.substr(5, 2), 16)];
    }
    var a = p(hex), b = p(hex2), o = '#';
    for (var i = 0; i < 3; i++) {
      var v = Math.round(a[i] + (b[i] - a[i]) * t);
      o += ('0' + v.toString(16)).slice(-2);
    }
    return o;
  }

  /* ステージセレクト用の顔アイコン（本体と同じ配色で描く）
     dim=true（撃破済み）でも、どのボスか分かるよう色味は残す */
  function drawFace(key, x, y, size, dim) {
    var d = BY_KEY[key].def;
    var c = d.col;
    var s = size / 24;
    function R(dx, dy, w, h, col) {
      gfx.rect(x + dx * s, y + dy * s, Math.max(1, w * s), Math.max(1, h * s), col);
    }
    var D = 0.72;                       // どれだけ暗くするか
    function dc(col) { return dim ? mix(col, '#1C1C2C', D) : col; }
    var main = dc(c.main);
    var light = dc(c.light);
    var dark = dc(c.dark);
    var eye = dc(c.eye);

    // 頭のベース
    R(-10, -10, 20, 20, '#101018');
    R(-9, -9, 18, 18, main);
    R(-9, -9, 18, 3, light);
    R(-9, 6, 18, 3, dark);
    // 顔（暗い面）
    R(-6, -3, 12, 9, '#101018');
    R(-4, 0, 3, 3, eye);
    R(1, 0, 3, 3, eye);
    // 口元
    R(-3, 4, 6, 1, dc(c.trim));

    // ボスごとの特徴（ここが各ボスの見分けどころ）
    if (key === 'elec') { R(-5, -14, 4, 5, light); R(1, -13, 4, 5, light); }
    if (key === 'fire') { R(-4, -15, 4, 6, dc('#FC9838'));
                          R(1, -16, 4, 7, dc('#FCE0A8')); }
    if (key === 'ice')  { R(-11, -7, 22, 5, dc('#BCE8FC')); }
    if (key === 'bomb') { R(-1, -14, 2, 5, dc('#8C4A20'));
                          R(-2, -17, 4, 3, dc('#FCE0A8')); }
    if (key === 'cut')  { R(-7, -16, 4, 8, dc('#D82800'));
                          R(3, -16, 4, 8, dc('#D82800')); }
    if (key === 'guts') { R(-12, -4, 5, 8, light); R(7, -4, 5, 8, light);
                          R(-9, -5, 18, 3, dc('#D8A860')); }
  }

  return {
    LIST: LIST, BY_KEY: BY_KEY, create: create, drawFace: drawFace,
    Hazard: Hazard, MAX_HP: MAX_HP,
    ElecMan: ElecMan, FireMan: FireMan, IceMan: IceMan,
    BombMan: BombMan, CutMan: CutMan, GutsMan: GutsMan
  };
})();


/* ===== src/game/items.js ===== */
/* =========================================================================
   items.js  --  取得アイテム（回復・武器エネルギー・1UP・E缶）
   ========================================================================= */
G.items = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio, TL = G.tiles;

  /* 種類ごとの設定。増やしたければここに足すだけ */
  var KINDS = {
    hpSmall: { spr:'hpSmall', hp: 2,  label:null,   color:'#F87858' },
    hpBig:   { spr:'hpBig',   hp: 10, label:null,   color:'#F87858' },
    wpSmall: { spr:'wpSmall', wp: 2,  label:null,   color:'#3CBCFC' },
    wpBig:   { spr:'wpBig',   wp: 10, label:null,   color:'#3CBCFC' },
    oneUp:   { spr:'oneUp',   life:1, label:'1UP',  color:'#BCE8FC' },
    eTank:   { spr:'eTank',   tank:1, label:'E',    color:'#B8F818' }
  };

  function Item(kind, x, y, opt) {
    opt = opt || {};
    this.kind = kind;
    this.def = KINDS[kind];
    var box = G.sprites.item[this.def.spr];
    this.w = box.w; this.h = box.h;
    this.x = x - this.w / 2;
    this.y = y - this.h / 2;
    this.vx = opt.vx || 0;
    this.vy = opt.vy === undefined ? -2.2 : opt.vy;
    this.age = 0;
    this.life = opt.permanent ? Infinity : 560;   // しばらくで消える
    this.dead = false;
    this.permanent = !!opt.permanent;
    this.landed = false;
  }
  var I = Item.prototype;

  I.hitbox = function () { return { x: this.x, y: this.y, w: this.w, h: this.h }; };
  I.cx = function () { return this.x + this.w / 2; };
  I.cy = function () { return this.y + this.h / 2; };

  I.update = function (st) {
    this.age++;
    if (!this.permanent && --this.life <= 0) { this.dead = true; return; }

    // 落ちて床に乗る
    if (!this.landed) {
      this.vy = Math.min(this.vy + 0.28, 6);
      this.x += this.vx;
      var r = TL.moveY(this, this.vy);
      if (r === 1) { this.landed = true; this.vx = 0; this.vy = 0; }
      var lv = TL.getLevel();
      if (lv && this.y > lv.pxH + 32) this.dead = true;
    }

    // キラキラ（1UP・E缶は目立たせる）
    if ((this.kind === 'oneUp' || this.kind === 'eTank') && this.age % 10 === 0) {
      G.fx.part({ x: this.cx() + U.rndRange(-8, 8), y: this.cy() + U.rndRange(-8, 8),
        vx: 0, vy: -0.35, life: 18, size: 2, color: '#FCFCFC', type: 'star', light: true });
    }
  };

  I.collect = function (st) {
    var pl = st.player, d = this.def;
    this.dead = true;

    if (d.hp) {
      pl.hp = Math.min(pl.maxHp, pl.hp + d.hp);
      A.sfx.energy();
      G.fx.floatText('+' + d.hp, this.cx(), this.y - 4, '#F87858');
    }
    if (d.wp) {
      var id = pl.weaponId();
      if (id === 'buster') {
        // バスターは無限なので、代わりに他の武器を回復してあげる
        for (var i = 0; i < pl.weapons.length; i++) {
          var w = pl.weapons[i];
          if (w !== 'buster') pl.ammo[w] = Math.min(G.Player.MAX_AMMO, pl.ammo[w] + d.wp);
        }
      } else {
        pl.ammo[id] = Math.min(G.Player.MAX_AMMO, pl.ammo[id] + d.wp);
      }
      A.sfx.energy();
      G.fx.floatText('+' + d.wp, this.cx(), this.y - 4, '#3CBCFC');
    }
    if (d.life) {
      pl.lives++;
      A.sfx.oneUp();
      // 画面いっぱいのキラキラ
      for (var k = 0; k < 26; k++) {
        G.fx.part({ x: U.rndRange(0, gfx.W) + st.camX, y: U.rndRange(0, gfx.H) + st.camY,
          vx: U.rndRange(-0.4, 0.4), vy: U.rndRange(-1.4, -0.3),
          life: U.rndInt(26, 50), size: U.rndInt(2, 4),
          color: '#FCFCFC', color2: '#3CBCFC', type: 'star', light: true });
      }
      G.fx.flash('#FCFCFC', 8, 0.4);
      G.fx.floatText('1UP', this.cx(), this.y - 6, '#BCE8FC', 2);
    }
    if (d.tank) {
      st.tanks = Math.min(4, (st.tanks || 0) + 1);
      A.sfx.oneUp();
      G.fx.floatText('E TANK', this.cx(), this.y - 6, '#B8F818');
      G.fx.sparkle(this.cx(), this.cy(), 16, '#B8F818');
    }
    G.fx.burst(this.cx(), this.cy(), 8, { speed: 1.6, life: 16, size: 2, color: d.color, light: true });
  };

  I.draw = function (camX, camY) {
    // 消える直前は点滅して知らせる
    if (!this.permanent && this.life < 120 && Math.floor(this.life / 5) % 2 === 0) return;
    var box = G.sprites.item[this.def.spr];
    var bob = this.landed ? Math.round(Math.sin(this.age * 0.12) * 1) : 0;
    gfx.ctx.drawImage(box.r, Math.round(this.x - camX), Math.round(this.y - camY + bob));
  };

  /* 敵を倒したときのドロップ抽選 */
  function randomDrop(x, y) {
    var r = U.rnd();
    var kind;
    if (r < 0.03) kind = 'oneUp';
    else if (r < 0.09) kind = 'hpBig';
    else if (r < 0.20) kind = 'wpBig';
    else if (r < 0.55) kind = 'hpSmall';
    else kind = 'wpSmall';
    return new Item(kind, x, y, { vx: U.rndRange(-0.5, 0.5), vy: -2.4 });
  }

  return { Item: Item, KINDS: KINDS, randomDrop: randomDrop };
})();


/* ===== src/game/hud.js ===== */
/* =========================================================================
   hud.js  --  画面表示（体力ゲージ・武器ゲージ・ボスHP・残機）

   ロックマンらしい「横向きの目盛りゲージ」を再現。
   武器エネルギーが少ないときは点滅して警告する。
   ========================================================================= */
G.hud = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, W = G.weapons;

  var SEG_H = 2;      // 目盛り1本の高さ
  var SEG_GAP = 1;
  var BAR_W = 8;

  /* 縦型の目盛りゲージを描く（下から積み上がる） */
  function gauge(x, y, value, max, colHi, colLo, blink) {
    var segs = 28;
    var filled = Math.ceil(U.clamp(value / max, 0, 1) * segs);
    var h = segs * (SEG_H + SEG_GAP) + 3;

    // 枠
    gfx.rect(x - 2, y - 2, BAR_W + 4, h, '#101018');
    gfx.rect(x - 1, y - 1, BAR_W + 2, h - 2, '#FCFCFC');
    gfx.rect(x, y, BAR_W, h - 4, '#101018');

    for (var i = 0; i < segs; i++) {
      var sy = y + (segs - 1 - i) * (SEG_H + SEG_GAP) + 1;
      if (i < filled) {
        if (blink && (Math.floor(Date.now() / 120) % 2 === 0)) continue;
        gfx.rect(x + 1, sy, BAR_W - 2, SEG_H, colHi);
        gfx.rect(x + 1, sy, 2, SEG_H, colLo);
      }
    }
  }

  /* --- ステージ中のHUD --- */
  function drawStage(st) {
    var pl = st.player;
    var x = 10, y = 12;

    // 体力
    gauge(x, y, pl.hp, pl.maxHp, '#3CBCFC', '#FCFCFC', false);
    gfx.text('P', x + 1, y - 11, { color: '#FCFCFC', shadow: '#101018' });

    // 武器エネルギー（バスター以外を選んでいる時だけ）
    var wid = pl.weaponId();
    if (wid !== 'buster') {
      var def = W.BY_ID[wid];
      var amt = pl.ammo[wid];
      var low = amt <= def.cost * 2;      // あと2発以下なら警告点滅
      gauge(x + 18, y, amt, G.Player.MAX_AMMO, def.color, '#FCFCFC', low);
      gfx.text(def.short.charAt(0), x + 19, y - 11, { color: def.color, shadow: '#101018' });
    }

    // 選択中の武器アイコン（右上：切り替えボタンの近く）
    var ix = gfx.W - 20, iy = 44;
    gfx.rect(ix - 12, iy - 12, 24, 24, '#101018');
    gfx.rectLine(ix - 12, iy - 12, 24, 24, W.BY_ID[wid].color, 1);
    W.drawIcon(wid, ix, iy, 1);
    if (pl.weapons.length > 1) {
      gfx.text((pl.weaponIndex + 1) + '/' + pl.weapons.length, ix, iy + 14,
        { align: 'center', color: '#BCBCBC', shadow: '#101018' });
    }

    // 残機
    gfx.text('x' + pl.lives, 24, gfx.H - 14, { color: '#FCFCFC', shadow: '#101018' });
    var box = G.sprites.item.oneUp;
    gfx.ctx.drawImage(box.r, 8, gfx.H - 18);

    // E缶
    if (st.tanks > 0) {
      gfx.ctx.drawImage(G.sprites.item.eTank.r, 52, gfx.H - 18);
      gfx.text('x' + st.tanks, 68, gfx.H - 14, { color: '#B8F818', shadow: '#101018' });
    }
  }

  /* --- ボスの体力ゲージ（右側に縦置き。原作と同じ位置） --- */
  function drawBoss(boss) {
    if (!boss || !boss.active) return;
    var x = 34, y = 12;
    var col = boss.col.light;
    gauge(x, y, boss.hp, boss.maxHp, col, '#FCFCFC', false);
    gfx.text('B', x + 1, y - 11, { color: col, shadow: '#101018' });
  }

  /* --- 汎用：中央の大きなメッセージ（READY / GO! など） --- */
  function bigText(str, y, opt) {
    opt = opt || {};
    gfx.text(str, gfx.W / 2, y, {
      align: 'center', scale: opt.scale || 3,
      color: opt.color || '#FCFCFC',
      outline: opt.outline || '#101018'
    });
  }

  return { drawStage: drawStage, drawBoss: drawBoss, gauge: gauge, bigText: bigText };
})();


/* ===== src/scenes/title.js ===== */
/* =========================================================================
   scenes/title.js  --  タイトル画面

   演出:
     ロゴが上から落下 → バウンドして着地 → 衝撃波＋画面揺れ＋土煙
     → サブタイトルがフェードイン → 「PRESS START」が点滅
     背景は星＋スクロールする格子＋走査線でレトロ感を出す
   ========================================================================= */
G.scenes = G.scenes || {};
G.scenes.title = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio;

  var t = 0;
  var logoY = 0, logoLanded = false;
  var DROP_FRAMES = 46;
  var ready = false;

  function enter() {
    t = 0;
    logoLanded = false;
    ready = false;
    G.fx.reset();
    G.input.visible = false;      // タイトルでは仮想パッドを隠す
    G.music.play('title');
  }

  function exit() { G.input.visible = true; }

  function update() {
    t++;

    /* --- ロゴの落下 --- */
    var targetY = gfx.H * 0.30;
    if (t <= DROP_FRAMES) {
      var k = t / DROP_FRAMES;
      logoY = U.lerp(-70, targetY, U.ease.outBounce(k));
    } else {
      logoY = targetY;
      if (!logoLanded) {
        logoLanded = true;
        // 着地の衝撃
        A.sfx.land2();
        A.sfx.explode();
        G.fx.shake(5, 22);
        G.fx.flash('#FCFCFC', 5, 0.5);
        G.fx.ring(gfx.W / 2, logoY + 24, 6, gfx.W * 0.75, 26, '#3CBCFC', 2);
        G.fx.burst(gfx.W / 2, logoY + 26, 26, {
          speed: 3.4, life: 30, size: 3, dir: -Math.PI / 2,
          colors: ['#FCFCFC', '#3CBCFC', '#0058F8'], grav: 0.12, light: true
        });
        // 左右に土煙
        for (var i = 0; i < 10; i++) {
          G.fx.part({
            x: gfx.W / 2 + U.rndRange(-70, 70), y: logoY + 26,
            vx: U.rndRange(-3, 3), vy: U.rndRange(-1.4, -0.2),
            drag: 0.93, life: U.rndInt(20, 34), size: 3,
            color: '#BCBCBC', color2: '#7C7C7C'
          });
        }
      }
    }

    if (t > DROP_FRAMES + 40) ready = true;

    // 背景の漂う粒
    if (t % 7 === 0) {
      G.fx.part({
        x: U.rndRange(0, gfx.W), y: gfx.H + 4,
        vx: U.rndRange(-0.2, 0.2), vy: -U.rndRange(0.25, 0.8),
        life: U.rndInt(90, 180), size: U.rndInt(1, 2), fade: true, shrink: false,
        color: U.pick(['#3CBCFC', '#0058F8', '#FCFCFC'])
      });
    }

    /* --- スタート待ち --- */
    if (ready && (G.input.anyPressed || G.input.pressed.start)) {
      A.sfx.menuSelect();
      G.fx.flash('#FCFCFC', 10, 1);
      G.music.fadeOut(0.35);
      G.scene.go('select', null, { fade: 26 });
    }
  }

  function draw() {
    /* --- 背景 --- */
    gfx.clear('#000018');
    G.stages.starfield(t * 0.6, 0, 60, 1, ['#FCFCFC', '#3CBCFC', '#0058F8']);

    // 奥へ向かう格子（レトロSF感）
    var ctx = gfx.ctx;
    ctx.save();
    ctx.globalAlpha = 0.22;
    var horizon = gfx.H * 0.62;
    for (var i = 0; i < 14; i++) {
      var yy = horizon + Math.pow(i / 14, 2.2) * (gfx.H - horizon) + (t * 0.5 % 12);
      if (yy < gfx.H) gfx.rect(0, yy, gfx.W, 1, '#0058F8');
    }
    for (var j = -8; j <= 8; j++) {
      gfx.line(gfx.W / 2 + j * 12, horizon, gfx.W / 2 + j * 90, gfx.H, '#0058F8', 1);
    }
    ctx.restore();

    G.fx.draw(0, 0);

    /* --- ロゴ --- */
    var cx = gfx.W / 2;
    var scale = gfx.W < 300 ? 4 : 5;
    gfx.text('GANMAN', cx, logoY, { align: 'center', scale: scale, color: '#3CBCFC', outline: '#101018' });
    // 文字の上だけを白く光らせる「ツヤ」を左から右へ走らせる
    if (logoLanded) {
      var lw = gfx.textWidth('GANMAN', scale);
      var sweep = ((t * 3) % (lw + 160)) - 80;
      ctx.save();
      ctx.beginPath();
      ctx.rect(cx - lw / 2 + sweep, logoY - 4, 12, gfx.FONT_H * scale + 8);
      ctx.clip();
      gfx.text('GANMAN', cx, logoY, { align: 'center', scale: scale, color: '#FCFCFC' });
      ctx.restore();
    }

    /* --- サブタイトル --- */
    if (t > DROP_FRAMES + 8) {
      var a = U.clamp((t - DROP_FRAMES - 8) / 24, 0, 1);
      ctx.save(); ctx.globalAlpha = a;
      gfx.text('- ROBOT MASTER WARS -', cx, logoY + gfx.FONT_H * scale + 10,
        { align: 'center', scale: 1, color: '#FCE0A8', shadow: '#101018' });
      ctx.restore();
    }

    /* --- PRESS START --- */
    if (ready && (Math.floor(t / 22) % 2 === 0)) {
      gfx.text('PRESS START', cx, gfx.H - 58,
        { align: 'center', scale: 2, color: '#FCFCFC', outline: '#101018' });
    }
    if (ready) {
      gfx.text('TAP ANYWHERE TO BEGIN', cx, gfx.H - 34,
        { align: 'center', scale: 1, color: '#7C88A0' });
    }

    gfx.text('2024  CANVAS ACTION', cx, gfx.H - 16,
      { align: 'center', scale: 1, color: '#4C5468' });

    G.fx.drawFlash();
    gfx.scanlines(0.14);
  }

  return { enter: enter, exit: exit, update: update, draw: draw };
})();


/* ===== src/scenes/select.js ===== */
/* =========================================================================
   scenes/select.js  --  ステージセレクト

   演出:
     入場時にボスの顔パネルが1枚ずつ順番に点灯（音つき）
     選択中のパネルは拡大＋枠が光り、下に名前を表示
     決定すると選択音＋画面が白くフラッシュしてステージへ

   操作:
     パネルを直接タップ → 選択（もう一度タップで決定）
     スティックで移動、JUMP/SHOT/START で決定
   ========================================================================= */
G.scenes.select = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio, BS = G.bosses;

  /* 3x3 の配置。null は空きパネル、'center' は中央 */
  var GRID = [
    'cut',  'elec',  'ice',
    'fire', 'center','bomb',
    null,   'guts',  null
  ];

  var t = 0;
  var lit = 0;              // 何枚まで点灯したか
  var sel = 0;              // 選択中のセル番号
  var confirmT = -1;        // 決定演出のカウンタ
  var pulse = 0;

  var PANEL_W = 62, PANEL_H = 46, GAP = 6;

  function cellRect(i) {
    var col = i % 3, row = (i / 3) | 0;
    var gw = PANEL_W * 3 + GAP * 2;
    var gh = PANEL_H * 3 + GAP * 2;
    var ox = (gfx.W - gw) / 2;
    var oy = (gfx.H - gh) / 2 + 8;
    return { x: ox + col * (PANEL_W + GAP), y: oy + row * (PANEL_H + GAP), w: PANEL_W, h: PANEL_H };
  }

  function isSelectable(i) {
    var k = GRID[i];
    if (!k) return false;
    if (k === 'center') return allCleared();     // 全部倒したら中央が最終ステージに
    return !G.game.cleared[k];
  }
  function allCleared() {
    return BS.LIST.every(function (b) { return G.game.cleared[b.key]; });
  }

  function firstSelectable() {
    for (var i = 0; i < 9; i++) if (isSelectable(i)) return i;
    return 4;
  }

  function enter() {
    t = 0; lit = 0; confirmT = -1;
    G.fx.reset();
    G.input.visible = false;
    sel = firstSelectable();
    G.music.play('select');
  }
  function exit() { G.input.visible = true; }

  /* 十字方向にセルを探す（空きパネルは飛ばす） */
  function move(dx, dy) {
    var col = sel % 3, row = (sel / 3) | 0;
    for (var step = 1; step <= 3; step++) {
      var nc = (col + dx * step + 3) % 3;
      var nr = (row + dy * step + 3) % 3;
      var ni = nr * 3 + nc;
      if (isSelectable(ni)) {
        if (ni !== sel) { sel = ni; A.sfx.menuMove(); pulse = 8; }
        return;
      }
    }
  }

  function confirm() {
    if (!isSelectable(sel)) { A.sfx.deny(); return; }
    confirmT = 0;
    A.sfx.menuSelect();
    G.music.fadeOut(0.4);
  }

  function update() {
    t++;
    if (pulse > 0) pulse--;

    /* --- 順番に点灯する演出 --- */
    if (lit < 9) {
      if (t % 7 === 0) {
        lit++;
        if (GRID[lit - 1]) A.sfx.blip();
        if (lit === 9) A.sfx.menuMove();
      }
      return;
    }

    /* --- 決定演出中 --- */
    if (confirmT >= 0) {
      confirmT++;
      if (confirmT === 1) G.fx.flash('#FCFCFC', 22, 1);
      if (confirmT === 4) {
        var r = cellRect(sel);
        G.fx.burst(r.x + r.w / 2, r.y + r.h / 2, 24,
          { speed: 4, life: 24, size: 3, color: '#FCFCFC', light: true });
      }
      if (confirmT > 30) {
        var k = GRID[sel];
        if (k === 'center') G.scene.go('ending', null, { fade: 30 });
        else G.scene.go('stage', { key: k }, { fade: 24 });
      }
      return;
    }

    // 選択中のパネルが選べなくなっていたら（クリア直後など）選び直す
    if (!isSelectable(sel)) sel = firstSelectable();

    /* --- キー／スティック操作 --- */
    var inp = G.input;
    if (inp.pressed.left)  move(-1, 0);
    if (inp.pressed.right) move(1, 0);
    if (inp.pressed.up)    move(0, -1);
    if (inp.pressed.down)  move(0, 1);
    if (inp.pressed.jump || inp.pressed.shot || inp.pressed.start) confirm();

    /* --- パネルを直接タップ ---
       1回目のタップで選択、同じパネルをもう一度タップで決定。
       （押し間違いでいきなりステージが始まらないようにするため）      */
    for (var ti = 0; ti < inp.taps.length; ti++) {
      var tap = inp.taps[ti];
      for (var i = 0; i < 9; i++) {
        if (!isSelectable(i)) continue;
        var r = cellRect(i);
        if (tap.x >= r.x - 4 && tap.x <= r.x + r.w + 4 &&
            tap.y >= r.y - 4 && tap.y <= r.y + r.h + 4) {
          if (i === sel) { confirm(); }
          else { sel = i; A.sfx.menuMove(); pulse = 8; }
          break;
        }
      }
    }
  }

  /* ---------------- 1枚のパネルを描く ---------------- */
  function drawPanel(i) {
    var k = GRID[i];
    var r = cellRect(i);
    var isSel = (i === sel) && isSelectable(i);
    var cleared = k && k !== 'center' && G.game.cleared[k];
    var ctx = gfx.ctx;

    // 選択中は少し拡大する
    var grow = isSel ? (2 + (pulse > 0 ? 2 : 0)) : 0;
    var x = r.x - grow, y = r.y - grow, w = r.w + grow * 2, h = r.h + grow * 2;

    // 枠
    var border = '#2C2C4C';
    if (isSel) border = (Math.floor(t / 6) % 2 === 0) ? '#FCFCFC' : '#3CBCFC';
    else if (cleared) border = '#5C2020';

    gfx.rect(x, y, w, h, '#080814');
    gfx.rectLine(x, y, w, h, border, 2);

    if (!k) {
      // 空きパネル：暗いままノイズだけ
      for (var n = 0; n < 6; n++) {
        var nx = x + 6 + ((n * 37 + t) % (w - 12));
        gfx.rect(nx, y + 8 + ((n * 13) % (h - 16)), 2, 1, '#181828');
      }
      return;
    }

    var cx = x + w / 2, cy = y + h / 2 - 4;

    if (k === 'center') {
      // 中央：自機の顔（全ボス撃破後は「FINAL」になる）
      var can = allCleared();
      var pbox = G.sprites.player.idle;
      ctx.save();
      if (!can) ctx.globalAlpha = 0.55;
      // 顔だけ切り出して2倍で描く
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(pbox.r, 0, 0, 16, 11, Math.round(cx - 16), Math.round(cy - 12), 32, 22);
      ctx.restore();
      gfx.text(can ? 'FINAL' : 'GANMAN', cx, y + h - 12,
        { align: 'center', color: can ? '#F8D878' : '#7C88A0' });
      if (can && Math.floor(t / 8) % 2 === 0) {
        gfx.rectLine(x - 2, y - 2, w + 4, h + 4, '#F8D878', 1);
      }
      return;
    }

    // ボスの顔
    BS.drawFace(k, cx, cy, 34, cleared);

    // 名前
    var def = BS.BY_KEY[k].def;
    var label = def.name.split(' ')[0];
    gfx.text(label, cx, y + h - 11, {
      align: 'center',
      color: cleared ? '#7C3030' : (isSel ? '#FCFCFC' : '#9CA8B8')
    });

    // 撃破済みマーク
    if (cleared) {
      ctx.save();
      ctx.globalAlpha = 0.85;
      gfx.line(x + 8, y + 8, x + w - 8, y + h - 14, '#D82800', 2);
      gfx.line(x + w - 8, y + 8, x + 8, y + h - 14, '#D82800', 2);
      ctx.restore();
    }

    // 選択中はキラッと光る粒
    if (isSel && t % 6 === 0) {
      G.fx.part({ x: cx + U.rndRange(-w / 2, w / 2), y: cy + U.rndRange(-h / 2, h / 2),
        vx: 0, vy: -0.5, life: 16, size: 2, color: '#FCFCFC', type: 'star', light: true });
    }
  }

  function draw() {
    /* --- 背景 --- */
    gfx.clear('#0C0C1C');
    G.stages.starfield(t * 0.3, 0, 40, 1, ['#1C1C3C', '#2C2C5C']);
    // 走る横線
    var ctx = gfx.ctx;
    ctx.save(); ctx.globalAlpha = 0.3;
    for (var y = (t * 0.6) % 16; y < gfx.H; y += 16) gfx.rect(0, y, gfx.W, 1, '#141428');
    ctx.restore();

    /* --- 見出し --- */
    gfx.text('STAGE SELECT', gfx.W / 2, 10,
      { align: 'center', scale: 2, color: '#3CBCFC', outline: '#101018' });

    /* --- パネル --- */
    for (var i = 0; i < 9; i++) {
      if (i < lit) drawPanel(i);
    }

    /* --- 選択中のボス名（フルネーム） --- */
    var k = GRID[sel];
    if (lit >= 9 && k && k !== 'center') {
      var def = G.bosses.BY_KEY[k].def;
      gfx.text(def.name, gfx.W / 2, gfx.H - 30,
        { align: 'center', scale: 2, color: def.col.light, outline: '#101018' });
      // 弱点のヒント（その武器を持っていたら教えてあげる）
      var weak = def.weakness;
      if (G.game.weapons.indexOf(weak) >= 0) {
        gfx.text('WEAK: ' + G.weapons.BY_ID[weak].name, gfx.W / 2, gfx.H - 12,
          { align: 'center', color: '#F8D878' });
      } else {
        gfx.text('TAP AGAIN TO START', gfx.W / 2, gfx.H - 12,
          { align: 'center', color: '#7C88A0' });
      }
    } else if (lit >= 9 && k === 'center' && allCleared()) {
      gfx.text('ALL STAGES CLEAR', gfx.W / 2, gfx.H - 30,
        { align: 'center', scale: 2, color: '#F8D878', outline: '#101018' });
    }

    /* --- 入手済み武器の一覧（左上。下部の文字と重ならない位置） --- */
    var wx = 8, wy = 16;
    for (var wi = 0; wi < G.game.weapons.length; wi++) {
      var id = G.game.weapons[wi];
      gfx.rect(wx - 1, wy - 9, 18, 18, '#0A0A18');
      gfx.rectLine(wx - 1, wy - 9, 18, 18, '#2C2C4C', 1);
      G.weapons.drawIcon(id, wx + 8, wy, 1);
      wx += 20;
    }

    /* --- 残機 --- */
    gfx.text('x' + G.game.lives, gfx.W - 14, gfx.H - 18,
      { align: 'right', color: '#FCFCFC', shadow: '#101018' });
    gfx.ctx.drawImage(G.sprites.item.oneUp.r, gfx.W - 12, gfx.H - 22);

    G.fx.draw(0, 0);
    G.fx.drawFlash();
    gfx.scanlines(0.12);
  }

  return { enter: enter, exit: exit, update: update, draw: draw };
})();


/* ===== src/scenes/stage.js ===== */
/* =========================================================================
   scenes/stage.js  --  ステージ本編

   フェーズの流れ:
     intro   … 暗転明け → READY → テレポート着地 → 小ジャンプ → GO!
     play    … 通常プレイ（スクロール／敵／アイテム）
     door    … ボス部屋の扉が開いて中へ歩いていく
     bossin  … ボス登場（落下 or スライドイン）＋名前表示
     boss    … ボス戦
     dying   … ボス撃破演出（スロー＋爆発＋無音＋ファンファーレ）
     dead    … やられ演出 → 復活 or ゲームオーバー
     pause   … ポーズメニュー（武器選択・E缶）
   ========================================================================= */
G.scenes.stage = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio, TL = G.tiles, WP = G.weapons, BS = G.bosses;

  var st = null;      // 現在のステージ状態（オブジェクトにまとめておく）

  /* ======================================================================
     初期化
     ====================================================================== */
  function enter(params) {
    var key = (params && params.key) || 'cut';
    var data = G.stages.build(key);

    var level = TL.makeLevel(data.rows, data.theme);
    TL.setLevel(level);

    st = {
      key: key,
      data: data,
      level: level,
      theme: data.theme,

      player: new G.Player(data.playerStart.x, data.playerStart.y),
      enemies: [], shots: [], hazards: [], items: [],
      spawners: [],
      boss: null,

      camX: 0, camY: 0,
      zoom: 1, zoomTarget: 1, zoomTimer: 0,

      phase: 'intro',
      phaseT: 0,
      introStep: 0,
      t: 0,

      checkpoint: null,       // 中間ポイントを通過したら入る
      tanks: G.game.tanks || 0,
      deathT: 0,
      clearT: 0,
      pauseSel: 0,
      pausedFrom: 'play',
      doorOpen: 0,
      bossNameT: 0,
      silence: 0             // 撃破後の「短い無音」用
    };

    // プレイヤーに引き継ぎデータを反映
    var pl = st.player;
    pl.lives = G.game.lives;
    pl.weapons = G.game.weapons.slice();
    pl.weaponIndex = 0;
    for (var id in G.game.ammo) if (G.game.ammo.hasOwnProperty(id)) pl.ammo[id] = G.game.ammo[id];
    pl.controlEnabled = false;

    // 敵の出現ポイント（画面に入ったら湧く／出たら消える＝原作方式）
    data.spawns.forEach(function (sp) {
      st.spawners.push({ type: sp.type, x: sp.x, y: sp.y, opts: sp.opts, entity: null, armed: true });
    });
    // 固定配置アイテム
    data.items.forEach(function (it) {
      st.items.push(new G.items.Item(it.kind, it.x, it.y - 8, { permanent: true }));
    });

    G.fx.reset();
    G.input.visible = false;      // READY/GO の間はパッドを隠す
    G.music.stop();
    updateCamera(true);
  }

  function exit() {
    G.input.visible = true;
    A.chargeStop();
  }

  /* ======================================================================
     ステージ側がゲーム部品に提供する機能（弾やボスから呼ばれる）
     ====================================================================== */
  function makeApi() {
    st.spawnBlast = function (x, y, radius, dmg, element, team) {
      var b = new WP.Blast(x, y, radius, dmg, element, team || 'player');
      st.shots.push(b);
      G.fx.explode(x, y, radius / 24);
      A.sfx.explode();
      G.fx.shake(3, 14);
      return b;
    };
    st.dropItem = function (x, y) { st.items.push(G.items.randomDrop(x, y)); };
    st.requestZoom = function (z, frames) {
      st.zoomTarget = z; st.zoomTimer = frames;
    };
    st.onBossDying = function () {
      st.phase = 'dying'; st.phaseT = 0;
      // 撃破演出中に残り弾で死ぬのは理不尽なので、敵の攻撃を全部消して無敵にする
      // （配列を作り直すと当たり判定のループ中に壊れるので dead フラグで消す）
      for (var i = 0; i < st.shots.length; i++) {
        if (st.shots[i].team === 'enemy') st.shots[i].dead = true;
      }
      for (var j = 0; j < st.hazards.length; j++) st.hazards[j].dead = true;
      st.player.invul = 99999;
      G.music.fadeOut(0.5);
    };
    st.onBossDefeated = function () {
      st.silence = 46;   // 大爆発のあと少し無音にしてから勝利ファンファーレ
    };
  }

  /* ======================================================================
     カメラ
     ====================================================================== */
  function updateCamera(snap) {
    var pl = st.player;
    var viewW = gfx.W / st.zoom;
    var viewH = gfx.H / st.zoom;
    var lv = st.level;

    var tx, ty;

    if (st.phase === 'door' || st.phase === 'bossin' || st.phase === 'boss' ||
        st.phase === 'dying' || st.phase === 'clear') {
      // ボス部屋にカメラを固定。
      // 床を画面の 64% の高さに置くことで、戦闘が仮想パッドより上で行われる
      // （下部にボタンがあるスマホでもキャラが指に隠れない）
      var ar = st.data.boss.arena;
      var arW = ar.x1 - ar.x0;
      tx = ar.x0 + (arW - viewW) / 2;
      tx = U.clamp(tx, ar.x0, Math.max(ar.x0, ar.x1 - viewW));
      ty = ar.floorY - viewH * 0.64;
    } else {
      // 通常：プレイヤーを画面の少し左寄りに置く
      tx = pl.cx() - viewW * 0.42;
      // 縦は「遊び」を持たせて追う（細かい上下でカメラが揺れないように）
      var py = pl.cy();
      var top = st.camY + viewH * 0.32, bot = st.camY + viewH * 0.62;
      ty = st.camY;
      if (py < top) ty = py - viewH * 0.32;
      else if (py > bot) ty = py - viewH * 0.62;
    }

    tx = U.clamp(tx, 0, Math.max(0, lv.pxW - viewW));
    ty = U.clamp(ty, 0, Math.max(0, lv.pxH - viewH));

    if (snap) { st.camX = tx; st.camY = ty; }
    else {
      st.camX = U.lerp(st.camX, tx, 0.22);
      st.camY = U.lerp(st.camY, ty, 0.12);
    }
  }

  /* ======================================================================
     敵の湧き／消え（原作準拠：画面外に出ると消え、戻ると復活）
     ====================================================================== */
  function updateSpawners() {
    var viewW = gfx.W / st.zoom, viewH = gfx.H / st.zoom;
    var L = st.camX - 48, R = st.camX + viewW + 48;
    var farL = st.camX - viewW * 0.8, farR = st.camX + viewW * 1.8;

    for (var i = 0; i < st.spawners.length; i++) {
      var s = st.spawners[i];
      if (s.entity) {
        // 画面から大きく離れたら消す（次に近づいた時に復活する）
        if (s.entity.dead) { s.entity = null; }
        else if (s.entity.x < farL || s.entity.x > farR) { s.entity.dead = true; s.entity = null; s.armed = true; }
      } else {
        if (s.x < L || s.x > R) { s.armed = true; continue; }
        if (!s.armed) continue;
        // 縦にも離れすぎていたら湧かせない
        if (s.y < st.camY - 64 || s.y > st.camY + viewH + 64) continue;
        var e = G.enemies.create(s.type, s.x, s.y, s.opts);
        if (!e) continue;
        e.x = s.x - e.w / 2;
        e.y = s.y - e.h;
        if (s.type === 'plat') { e.ox = e.x; e.oy = e.y; }
        e.spawner = s;
        s.entity = e;
        s.armed = false;
        st.enemies.push(e);
      }
    }
  }

  /* ======================================================================
     当たり判定
     ====================================================================== */
  function collisions() {
    var pl = st.player, i, j;

    /* --- プレイヤーの弾 vs 敵/ボス --- */
    for (i = 0; i < st.shots.length; i++) {
      var s = st.shots[i];
      if (s.dead || s.team !== 'player') continue;

      // 雑魚敵
      for (j = 0; j < st.enemies.length; j++) {
        var e = st.enemies[j];
        if (e.dead || e.isPlatform) continue;
        if (!U.overlap(s.hitbox(), e.hitbox())) continue;
        if (e.invulnerable) {
          // 硬い相手は弾かれる
          A.sfx.deflect();
          G.fx.ricochet(s.cx(), s.cy(), '#FCFCFC');
          if (!s.pierce) s.dead = true;
          continue;
        }
        if (s.freeze) e.freezeMe(s.freeze);
        e.damage(s.dmg, s.element, st);
        if (s.onHit(e, st)) s.dead = true;
        if (s.dead) break;
      }
      if (s.dead) continue;

      // ボス
      var b = st.boss;
      if (b && !b.dead && b.state !== 'entrance' && U.overlap(s.hitbox(), b.hitbox())) {
        if (s.freeze) b.frozen = Math.min(60, s.freeze / 3);
        b.damage(s.dmg, s.element, st);
        if (s.onHit(b, st)) s.dead = true;
      }
    }

    /* --- 敵の弾・ハザード vs プレイヤー ---
       弾は dmg、敵本体は contactDmg を持つので取り違えないようにする      */
    function hurtPlayer(src, amount) {
      if (pl.invul > 0 || pl.state === 'dead') return;
      var dmg = (amount === undefined) ? src.dmg : amount;
      if (!(dmg > 0)) return;                       // undefined/NaN を弾く
      pl.damage(dmg, src.cx ? src.cx() : src.x);
    }
    for (i = 0; i < st.shots.length; i++) {
      var es = st.shots[i];
      if (es.dead || es.team !== 'enemy') continue;
      if (U.overlap(es.hitbox(), pl.hitbox())) {
        hurtPlayer(es);
        if (es.onHit(pl, st)) es.dead = true;
      }
    }
    for (i = 0; i < st.hazards.length; i++) {
      var hz = st.hazards[i];
      if (hz.dead) continue;
      if (U.overlap(hz.hitbox(), pl.hitbox())) hurtPlayer(hz);
    }

    /* --- 敵本体 vs プレイヤー（接触ダメージ） --- */
    for (i = 0; i < st.enemies.length; i++) {
      var en = st.enemies[i];
      if (en.dead || en.isPlatform || !en.contactDmg) continue;
      if (en.frozen > 0) continue;
      if (U.overlap(en.hitbox(), pl.hitbox())) hurtPlayer(en, en.contactDmg);
    }
    if (st.boss && !st.boss.dead && st.boss.state === 'fight' &&
        U.overlap(st.boss.hitbox(), pl.hitbox())) {
      hurtPlayer(st.boss, st.boss.contactDmg);
    }

    /* --- アイテム --- */
    for (i = 0; i < st.items.length; i++) {
      var it = st.items[i];
      if (it.dead) continue;
      if (U.overlap(it.hitbox(), pl.hitbox())) it.collect(st);
    }

    /* --- 動く足場に乗る --- */
    for (i = 0; i < st.enemies.length; i++) {
      var p = st.enemies[i];
      if (!p.isPlatform) continue;
      var feet = pl.y + pl.h;
      var prevFeet = pl.prevY + pl.h;
      if (pl.vy >= 0 &&
          pl.x + pl.w > p.x + 2 && pl.x < p.x + p.w - 2 &&
          feet >= p.y && feet <= p.y + 12 && prevFeet <= p.y + 4) {
        pl.y = p.y - pl.h;
        pl.vy = 0;
        pl.onGround = true;
        // 足場と一緒に運ばれる
        pl.x += p.x - p.prevX;
        pl.y += p.y - p.prevY;
      }
    }
  }

  /* ======================================================================
     フェーズごとの進行
     ====================================================================== */

  /* --- 開始演出 --- */
  function updateIntro() {
    var pl = st.player;
    st.phaseT++;
    var t = st.phaseT;

    if (t === 8) {
      // 短いファンファーレ
      [523, 659, 784].forEach(function (f, i) {
        A.tone({ type: 'square', freq: f, dur: 0.14, vol: 0.22, delay: i * 0.09 });
      });
    }
    if (t === 76) { pl.startTeleport(); }

    // テレポート着地 → 小さくジャンプ
    if (st.introStep === 0 && t > 76 && pl.state !== 'teleport') {
      st.introStep = 1;
      pl.vy = -3.6;
      pl.onGround = false;
      A.sfx.jump();
    }
    if (st.introStep === 1) {
      pl.update(st);   // 物理だけ動かす（操作は無効のまま）
      if (pl.onGround && pl.vy >= 0 && st.phaseT > 90) {
        st.introStep = 2;
        st.goT = 0;
        A.sfx.land();
        A.sfx.menuSelect();
        G.fx.flash('#FCFCFC', 6, 0.4);
        G.fx.dust(pl.cx() - 4, pl.y + pl.h, -1);
        G.fx.dust(pl.cx() + 4, pl.y + pl.h, 1);
        G.music.play(st.theme.bgm);
      }
    } else if (st.introStep === 2) {
      st.goT++;
      pl.update(st);
      if (st.goT > 40) {
        st.phase = 'play';
        st.phaseT = 0;
        pl.controlEnabled = true;
        G.input.visible = true;
        G.input.consumeAll();
      }
    } else if (st.introStep === 0 && t > 76) {
      pl.update(st);
    }
  }

  /* --- 通常プレイ --- */
  function updatePlay() {
    var pl = st.player;
    pl.prevY = pl.y;
    pl.update(st);

    // 中間ポイント通過
    var cp = st.data.checkpoint;
    if (!st.checkpoint && cp && pl.cx() > cp.x) {
      st.checkpoint = { x: cp.x, y: cp.y };
      A.sfx.pickup();
      A.sfx.chargeMax();
      G.fx.floatText('CHECK POINT', cp.x, cp.y - 54, '#F8D878');
      G.fx.sparkle(cp.x, cp.y - 40, 16, '#F8D878');
      G.fx.ring(cp.x, cp.y - 40, 3, 34, 18, '#F8D878');
    }

    // ボス部屋の手前まで来たら扉のシーケンスへ
    if (pl.cx() > st.data.boss.triggerX && pl.onGround) {
      st.phase = 'door'; st.phaseT = 0;
      pl.controlEnabled = false;
      pl.cancelCharge();
      A.sfx.doorOpen();
    }
  }

  /* --- 扉が開いてボス部屋へ --- */
  function updateDoor() {
    var pl = st.player;
    st.phaseT++;
    var t = st.phaseT;

    // 扉のタイルを消して「開いた」状態にする
    if (t === 14) {
      var d = st.data.boss;
      var tx = Math.floor(d.doorX / TL.T);
      var ty0 = Math.floor((d.arena.floorY - 64) / TL.T);
      for (var y = ty0; y < Math.floor(d.arena.floorY / TL.T); y++) {
        TL.setAt(tx, y, '.'); TL.setAt(tx + 1, y, '.');
      }
      st.doorOpen = 1;
      G.fx.burst(d.doorX + 16, d.arena.floorY - 30, 12,
        { speed: 2, life: 18, size: 2, color: '#00E8D8', light: true });
    }

    // 自動で右に歩かせる
    if (t > 14) {
      pl.face = 1;
      pl.vx = 1.35;
      pl.prevY = pl.y;
      pl.vy = Math.min(pl.vy + 0.25, 7);
      TL.moveX(pl, pl.vx);
      TL.moveY(pl, pl.vy);
      pl.onGround = TL.onGround(pl);
      pl.state = 'run';
      pl.animT++;
      if (pl.animT % 7 === 0) pl.runFrame = (pl.runFrame + 1) % 3;
    }

    // 部屋の中まで入ったら扉を閉じてボス登場へ
    if (pl.cx() > st.data.boss.arena.x0 + 104) {
      pl.vx = 0;
      pl.state = 'idle';
      A.sfx.doorClose();
      // 扉を元に戻す（戻れないようにする）
      var d2 = st.data.boss;
      var tx2 = Math.floor(d2.doorX / TL.T);
      for (var y2 = 0; y2 < Math.floor(d2.arena.floorY / TL.T); y2++) {
        TL.setAt(tx2, y2, '#'); TL.setAt(tx2 + 1, y2, '#');
      }
      st.phase = 'bossin';
      st.phaseT = 0;
      st.bossNameT = 0;
      G.music.fadeOut(0.3);
      // ボスを生成
      var b = BS.create(st.key, d2.spawnX, d2.spawnY);
      // ボスが動ける範囲は壁より少し内側にする（画面端＝指の下に隠れないため）
      b.arena = { x0: d2.arena.x0 + 20, x1: d2.arena.x1 - 34, floorY: d2.arena.floorY };
      st.boss = b;
      st.requestZoom(1.12, 999);   // 少しズームイン
    }
  }

  /* --- ボス登場演出 --- */
  function updateBossIn() {
    var pl = st.player;
    st.phaseT++;
    var b = st.boss;

    pl.prevY = pl.y;
    // プレイヤーは物理だけ効かせる
    pl.vy = Math.min(pl.vy + 0.25, 7);
    TL.moveY(pl, pl.vy);
    pl.onGround = TL.onGround(pl);

    b.update(st);

    // 着地後に名前を表示
    if (b.state === 'pose') {
      st.bossNameT++;
      if (st.bossNameT === 1) A.sfx.bossWarn();
      if (st.bossNameT === 30) { st.requestZoom(1.0, 30); }
      if (st.bossNameT > 96) {
        b.active = true;
        st.phase = 'boss';
        st.phaseT = 0;
        pl.controlEnabled = true;
        G.input.consumeAll();
        G.music.play('boss');
      }
    }
  }

  /* --- ボス戦 --- */
  function updateBoss() {
    var pl = st.player;
    pl.prevY = pl.y;
    pl.update(st);
    if (st.boss) st.boss.update(st);
  }

  /* --- ボス撃破演出 --- */
  function updateDying() {
    var pl = st.player;
    st.phaseT++;
    pl.prevY = pl.y;
    pl.controlEnabled = false;
    pl.vx *= 0.85;
    pl.update(st);
    if (st.boss) st.boss.update(st);

    // 大爆発のあとの「無音」→ 勝利ファンファーレ
    if (st.silence > 0) {
      st.silence--;
      if (st.silence === 0) {
        G.music.play('victory', { restart: true });
        pl.state = 'victory';
        st.clearT = 0;
        st.phase = 'clear';
      }
    }
  }

  /* --- クリア（勝利ポーズ → 武器ゲット画面へ） --- */
  function updateClear() {
    st.clearT++;
    var pl = st.player;
    pl.state = 'victory';
    if (st.clearT % 16 === 0) {
      G.fx.sparkle(pl.cx(), pl.cy(), 6, '#FCE0A8');
    }
    // 「STAGE CLEAR」の文字は drawOverlay 側で画面中央に出すので、
    // ここでは光の粒だけを足す（二重表示になっていた）
    if (st.clearT === 40) {
      G.fx.ring(pl.cx(), pl.cy(), 4, 40, 20, '#F8D878');
      G.fx.sparkle(pl.cx(), pl.cy(), 14, '#FCE0A8');
    }
    if (st.clearT > 170) {
      // 進行状況を保存して武器ゲット画面へ
      G.game.cleared[st.key] = true;
      G.game.lives = pl.lives;
      G.game.tanks = st.tanks;
      var dropId = st.boss.drop;
      if (G.game.weapons.indexOf(dropId) < 0) G.game.weapons.push(dropId);
      for (var id in pl.ammo) if (pl.ammo.hasOwnProperty(id)) G.game.ammo[id] = pl.ammo[id];
      G.game.ammo[dropId] = G.Player.MAX_AMMO;
      G.scene.go('weaponget', { weapon: dropId, boss: st.key }, { fade: 30 });
    }
  }

  /* --- やられ --- */
  function updateDead() {
    st.deathT++;
    if (st.deathT === 1) { G.music.fadeOut(0.4); A.chargeStop(); }
    if (st.deathT > 130) {
      var pl = st.player;
      pl.lives--;
      G.game.lives = pl.lives;
      if (pl.lives < 0) {
        st.phase = 'gameover';
        st.phaseT = 0;
        st.pauseSel = 0;          // ポーズメニューと共用なので YES に戻す
        G.music.play('gameover', { restart: true });
      } else {
        respawn();
      }
    }
  }

  function respawn() {
    var pl = st.player;
    var sp = st.checkpoint || st.data.playerStart;
    pl.x = sp.x - pl.w / 2;
    pl.y = sp.y - pl.h;
    pl.vx = pl.vy = 0;
    pl.hp = pl.maxHp;
    pl.invul = 60;
    pl.state = 'idle';
    pl.dead = false;
    pl.deathTimer = 0;
    pl.hurtTimer = 0;
    pl.controlEnabled = false;
    pl.climbing = false;

    // 敵と弾を全部リセット
    st.shots.length = 0;
    st.hazards.length = 0;
    st.enemies.length = 0;
    st.spawners.forEach(function (s) { s.entity = null; s.armed = true; });
    st.items = st.items.filter(function (i) { return i.permanent && !i.dead; });

    // ボス戦中に死んだらボスも作り直し
    if (st.boss) {
      st.boss = null;
      st.phase = 'intro';
      st.introStep = 0;
      // ボス部屋の扉を開け直す
      var d = st.data.boss;
      var tx = Math.floor(d.doorX / TL.T);
      for (var y = 0; y < Math.floor(d.arena.floorY / TL.T); y++) {
        TL.setAt(tx, y, y >= Math.floor((d.arena.floorY - 64) / TL.T) ? 'D' : '#');
      }
    } else {
      st.phase = 'intro';
      st.introStep = 0;
    }
    st.phaseT = 40;      // READY を短めに
    st.deathT = 0;
    st.zoom = 1; st.zoomTarget = 1;
    G.fx.reset();
    G.input.visible = false;
    updateCamera(true);
  }

  /* --- ゲームオーバー / コンティニュー --- */
  function updateGameOver() {
    st.phaseT++;
    var inp = G.input;
    if (st.phaseT < 100) return;

    if (inp.pressed.left || inp.pressed.right || inp.pressed.up || inp.pressed.down) {
      st.pauseSel = st.pauseSel === 0 ? 1 : 0;
      A.sfx.menuMove();
    }
    // タップでも選べるように
    for (var i = 0; i < inp.taps.length; i++) {
      var ty = inp.taps[i].y;
      var yes = gfx.H / 2 + 18, no = gfx.H / 2 + 40;
      if (Math.abs(ty - yes) < 12) { st.pauseSel = 0; A.sfx.menuMove(); }
      else if (Math.abs(ty - no) < 12) { st.pauseSel = 1; A.sfx.menuMove(); }
      else continue;
    }
    if (inp.pressed.jump || inp.pressed.shot || inp.pressed.start) {
      A.sfx.menuSelect();
      G.music.fadeOut(0.3);
      if (st.pauseSel === 0) {
        // コンティニュー：残機を戻して同じステージをやり直す（クリア状況は保持）
        G.game.lives = 2;
        G.scene.go('stage', { key: st.key }, { fade: 24 });
      } else {
        // タイトルへ戻る＝最初からやり直し
        G.game.reset();
        G.scene.go('title', null, { fade: 30 });
      }
    }
  }

  /* --- ポーズメニュー --- */
  function updatePause() {
    var inp = G.input;
    var pl = st.player;
    var n = pl.weapons.length + (st.tanks > 0 ? 1 : 0);

    if (inp.pressed.up)   { st.pauseSel = (st.pauseSel - 1 + n) % n; A.sfx.menuMove(); }
    if (inp.pressed.down) { st.pauseSel = (st.pauseSel + 1) % n; A.sfx.menuMove(); }

    // タップで直接選ぶ
    for (var i = 0; i < inp.taps.length; i++) {
      var idx = pauseHitTest(inp.taps[i]);
      if (idx >= 0) {
        if (idx === st.pauseSel) { applyPause(); return; }
        st.pauseSel = idx; A.sfx.menuMove();
      }
    }

    if (inp.pressed.jump || inp.pressed.shot) { applyPause(); return; }
    if (inp.pressed.pause || inp.pressed.start) { closePause(); }
  }

  function pauseHitTest(tap) {
    var pl = st.player;
    var n = pl.weapons.length + (st.tanks > 0 ? 1 : 0);
    var y0 = gfx.H / 2 - n * 11 + 8;
    for (var i = 0; i < n; i++) {
      var y = y0 + i * 22;
      if (tap.y >= y - 11 && tap.y <= y + 11 &&
          tap.x > gfx.W / 2 - 90 && tap.x < gfx.W / 2 + 90) return i;
    }
    return -1;
  }

  function applyPause() {
    var pl = st.player;
    if (st.pauseSel < pl.weapons.length) {
      pl.selectWeapon(st.pauseSel);
      closePause();
    } else {
      // E缶を使う
      if (st.tanks > 0 && pl.hp < pl.maxHp) {
        st.tanks--;
        pl.hp = pl.maxHp;
        A.sfx.oneUp();
        G.fx.sparkle(pl.cx(), pl.cy(), 20, '#B8F818');
        closePause();
      } else A.sfx.deny();
    }
  }

  function openPause() {
    st.pausedFrom = st.phase;
    st.phase = 'pause';
    st.pauseSel = st.player.weaponIndex;
    A.sfx.pause();
    G.music.duck(0.16);
    st.player.cancelCharge();
  }
  function closePause() {
    st.phase = st.pausedFrom;
    A.sfx.pause();
    G.music.duck(0.55);
    G.input.consumeAll();
  }

  /* ======================================================================
     メイン update
     ====================================================================== */
  function update() {
    if (!st.spawnBlast) makeApi();
    st.t++;
    var inp = G.input;
    var pl = st.player;

    /* --- ポーズの開閉 --- */
    if (st.phase === 'pause') { updatePause(); return; }
    if (inp.pressed.pause &&
        (st.phase === 'play' || st.phase === 'boss')) { openPause(); return; }

    /* --- ズームの補間 --- */
    if (st.zoomTimer > 0) { st.zoomTimer--; if (st.zoomTimer === 0) st.zoomTarget = 1; }
    st.zoom = U.lerp(st.zoom, st.zoomTarget, 0.06);

    /* --- プレイヤーがやられたら dead フェーズへ --- */
    if (pl.state === 'dead' && st.phase !== 'dead' && st.phase !== 'gameover') {
      st.phase = 'dead'; st.deathT = 0;
    }

    /* --- フェーズごとの処理 --- */
    switch (st.phase) {
      case 'intro':    updateIntro(); break;
      case 'play':     updatePlay(); break;
      case 'door':     updateDoor(); break;
      case 'bossin':   updateBossIn(); break;
      case 'boss':     updateBoss(); break;
      case 'dying':    updateDying(); break;
      case 'clear':    updateClear(); break;
      case 'dead':     pl.update(st); updateDead(); break;
      case 'gameover': updateGameOver(); break;
    }

    /* --- 共通の更新（演出中も弾やパーティクルは動かす） --- */
    if (st.phase !== 'gameover') {
      updateSpawners();

      var i;
      for (i = 0; i < st.enemies.length; i++) if (!st.enemies[i].dead) st.enemies[i].update(st);
      for (i = 0; i < st.shots.length; i++)   if (!st.shots[i].dead)   st.shots[i].update(st);
      for (i = 0; i < st.hazards.length; i++) if (!st.hazards[i].dead) st.hazards[i].update(st);
      for (i = 0; i < st.items.length; i++)   if (!st.items[i].dead)   st.items[i].update(st);

      if (st.phase !== 'dead' && st.phase !== 'clear') collisions();

      U.sweep(st.enemies); U.sweep(st.shots); U.sweep(st.hazards); U.sweep(st.items);
    }

    // G.fx.update() はメインループ側で毎ステップ呼ばれるのでここでは呼ばない
    updateCamera(false);
  }

  /* ======================================================================
     描画
     ====================================================================== */
  function draw() {
    var ctx = gfx.ctx;
    var camX = st.camX + G.fx.shakeX;
    var camY = st.camY + G.fx.shakeY;

    /* --- 背景（ズームの影響を受けない） --- */
    st.theme.drawBg(st.camX, st.camY, st.t);

    /* --- ワールド（ズーム適用） --- */
    ctx.save();
    if (Math.abs(st.zoom - 1) > 0.002) ctx.scale(st.zoom, st.zoom);

    TL.draw(camX, camY);
    drawCheckpoint(camX, camY);

    var i;
    for (i = 0; i < st.items.length; i++) st.items[i].draw(camX, camY);
    for (i = 0; i < st.enemies.length; i++) st.enemies[i].draw(camX, camY);
    if (st.boss) st.boss.draw(camX, camY);
    st.player.draw(camX, camY);
    for (i = 0; i < st.hazards.length; i++) st.hazards[i].draw(camX, camY);
    for (i = 0; i < st.shots.length; i++) st.shots[i].draw(camX, camY);

    G.fx.draw(camX, camY);
    ctx.restore();

    /* --- 前景の演出 --- */
    G.fx.drawFlash();

    /* --- 画面上の文字 --- */
    drawOverlay();

    /* --- HUD とコントローラ --- */
    if (st.phase !== 'gameover') {
      G.hud.drawStage(st);
      if (st.boss && (st.phase === 'boss' || st.phase === 'dying')) G.hud.drawBoss(st.boss);
    }
    G.input.drawControls(st.phase === 'pause' ? 0.25 : 1);

    if (st.phase === 'pause') drawPauseMenu();

    gfx.scanlines(0.10);
  }

  /* 中間ポイントの目印。通過前は暗く、通過すると点灯する */
  function drawCheckpoint(camX, camY) {
    var cp = st.data.checkpoint;
    if (!cp) return;
    var x = Math.round(cp.x - camX), y = Math.round(cp.y - camY);
    if (x < -30 || x > gfx.W + 30) return;
    var on = !!st.checkpoint;

    // 支柱
    gfx.rect(x - 2, y - 36, 4, 36, '#101018');
    gfx.rect(x - 1, y - 36, 2, 36, on ? '#7C7C7C' : '#4C4C5C');
    gfx.rect(x - 6, y - 3, 12, 3, '#101018');
    gfx.rect(x - 5, y - 2, 10, 2, on ? '#BCBCBC' : '#5C5C6C');

    // 先端のランプ
    var pulse = on ? (Math.sin(st.t * 0.12) * 0.5 + 0.5) : 0;
    var col = on ? '#F8D878' : '#3C3C4C';
    gfx.circle(x, y - 40, 5, '#101018');
    gfx.circle(x, y - 40, 4, col);
    if (on) {
      var ctx = gfx.ctx;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = 0.35 + pulse * 0.5;
      gfx.circle(x, y - 40, 8 + pulse * 3, '#F8D878');
      ctx.restore();
      if (st.t % 12 === 0) {
        G.fx.part({ x: cp.x, y: cp.y - 40, vx: U.rndRange(-0.3, 0.3), vy: -0.6,
          life: 22, size: 2, color: '#FCE0A8', type: 'star', light: true });
      }
    }
  }

  function drawOverlay() {
    var cy = gfx.H / 2;

    /* --- READY / GO! --- */
    if (st.phase === 'intro') {
      var t = st.phaseT;
      // 暗転からのフェード
      if (t < 30) gfx.veil('#000000', 1 - t / 30);
      if (st.introStep < 2 && t > 10 && Math.floor(t / 12) % 2 === 0) {
        G.hud.bigText('READY', cy - 12, { scale: 3, color: '#FCFCFC' });
      }
      if (st.introStep === 2) {
        var k = Math.min(1, st.goT / 8);
        var sc = 3 + (1 - U.ease.outCubic(k)) * 5;
        G.hud.bigText('GO!', cy - 14, { scale: sc, color: '#F8D878' });
      }
    }

    /* --- ボス名の表示 --- */
    if (st.phase === 'bossin' && st.bossNameT > 0) {
      var b = st.boss;
      var kk = U.clamp(st.bossNameT / 16, 0, 1);
      var slide = (1 - U.ease.outCubic(kk)) * 90;
      var alpha = Math.min(1, st.bossNameT / 8);
      var ctx = gfx.ctx;
      ctx.save(); ctx.globalAlpha = alpha;
      // 帯
      gfx.rect(0, gfx.H * 0.30, gfx.W, 30, '#101018');
      gfx.rect(0, gfx.H * 0.30, gfx.W, 1, b.col.light);
      gfx.rect(0, gfx.H * 0.30 + 29, gfx.W, 1, b.col.light);
      gfx.text(b.name, gfx.W / 2 + slide, gfx.H * 0.30 + 8,
        { align: 'center', scale: 3, color: b.col.light, outline: '#101018' });
      ctx.restore();
    }

    /* --- ボス撃破後の「STAGE CLEAR」 --- */
    if (st.phase === 'clear' && st.clearT > 40) {
      var a2 = Math.min(1, (st.clearT - 40) / 16);
      gfx.ctx.save(); gfx.ctx.globalAlpha = a2;
      G.hud.bigText('STAGE CLEAR', cy - 40, { scale: 3, color: '#F8D878' });
      gfx.ctx.restore();
    }

    /* --- やられ演出 --- */
    if (st.phase === 'dead' && st.deathT > 70) {
      gfx.veil('#000000', U.clamp((st.deathT - 70) / 50, 0, 1));
    }

    /* --- ゲームオーバー --- */
    if (st.phase === 'gameover') {
      gfx.veil('#000000', 1);
      var t2 = st.phaseT;
      var ga = U.clamp(t2 / 60, 0, 1);
      gfx.ctx.save(); gfx.ctx.globalAlpha = ga;
      G.hud.bigText('GAME OVER', cy - 46, { scale: 3, color: '#D82800' });
      gfx.ctx.restore();

      if (t2 > 100) {
        G.hud.bigText('CONTINUE?', cy - 8, { scale: 2, color: '#FCFCFC' });
        var yes = cy + 18, no = cy + 40;
        var blink = Math.floor(t2 / 10) % 2 === 0;
        gfx.text('YES', gfx.W / 2, yes - 4,
          { align: 'center', scale: 2, color: st.pauseSel === 0 ? (blink ? '#F8D878' : '#FCFCFC') : '#7C7C7C' });
        gfx.text('NO', gfx.W / 2, no - 4,
          { align: 'center', scale: 2, color: st.pauseSel === 1 ? (blink ? '#F8D878' : '#FCFCFC') : '#7C7C7C' });
        if (st.pauseSel === 0) gfx.text('>', gfx.W / 2 - 40, yes - 4, { scale: 2, color: '#F8D878' });
        else gfx.text('>', gfx.W / 2 - 34, no - 4, { scale: 2, color: '#F8D878' });
      }
    }
  }

  /* --- ポーズメニュー --- */
  function drawPauseMenu() {
    var pl = st.player;
    gfx.veil('#000018', 0.72);
    gfx.text('PAUSE', gfx.W / 2, 18, { align: 'center', scale: 2, color: '#3CBCFC', outline: '#101018' });

    var n = pl.weapons.length + (st.tanks > 0 ? 1 : 0);
    var y0 = gfx.H / 2 - n * 11 + 8;

    for (var i = 0; i < pl.weapons.length; i++) {
      var id = pl.weapons[i];
      var def = G.weapons.BY_ID[id];
      var y = y0 + i * 22;
      var on = (i === st.pauseSel);
      if (on) {
        gfx.rect(gfx.W / 2 - 92, y - 10, 184, 20, '#102040');
        gfx.rectLine(gfx.W / 2 - 92, y - 10, 184, 20, '#3CBCFC', 1);
      }
      G.weapons.drawIcon(id, gfx.W / 2 - 76, y, 1);
      gfx.text(def.name, gfx.W / 2 - 60, y - 3, { color: on ? '#FCFCFC' : '#9CA8B8' });
      // 残量ゲージ（横向き）
      if (id !== 'buster') {
        var amt = pl.ammo[id] / G.Player.MAX_AMMO;
        gfx.rect(gfx.W / 2 + 40, y - 4, 46, 8, '#101018');
        gfx.rect(gfx.W / 2 + 41, y - 3, 44 * amt, 6, def.color);
      } else {
        gfx.text('INF', gfx.W / 2 + 52, y - 3, { color: '#3CBCFC' });
      }
    }

    if (st.tanks > 0) {
      var yT = y0 + pl.weapons.length * 22;
      var onT = (st.pauseSel === pl.weapons.length);
      if (onT) {
        gfx.rect(gfx.W / 2 - 92, yT - 10, 184, 20, '#102040');
        gfx.rectLine(gfx.W / 2 - 92, yT - 10, 184, 20, '#B8F818', 1);
      }
      gfx.ctx.drawImage(G.sprites.item.eTank.r, gfx.W / 2 - 82, yT - 6);
      gfx.text('E TANK  x' + st.tanks, gfx.W / 2 - 60, yT - 3,
        { color: onT ? '#FCFCFC' : '#9CA8B8' });
    }

    gfx.text('TAP TO SELECT   II TO RESUME', gfx.W / 2, gfx.H - 16,
      { align: 'center', color: '#7C88A0' });
  }

  return { enter: enter, exit: exit, update: update, draw: draw,
           get state() { return st; } };
})();


/* ===== src/scenes/weaponget.js ===== */
/* =========================================================================
   scenes/weaponget.js  --  武器ゲット画面（ロックマンの醍醐味）

   演出:
     暗転 → 倒したボスの顔がぼんやり浮かぶ → 白フラッシュで武器アイコンに変化
     → 「YOU GOT [武器名]!」がタイプライター風に1文字ずつ表示
     → 専用ファンファーレ → 数秒後にステージセレクトへ
   ========================================================================= */
G.scenes.weaponget = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio;

  var t = 0;
  var weaponId = 'buster';
  var bossKey = 'cut';
  var typed = 0;          // タイプライターで表示済みの文字数
  var line1 = 'YOU GOT';
  var line2 = '';
  var done = false;

  var T_FACE = 20;        // ボスの顔が出るタイミング
  var T_MORPH = 62;       // 武器アイコンに変わる
  var T_TYPE = 82;        // 文字が出はじめる

  function enter(params) {
    t = 0; typed = 0; done = false;
    weaponId = (params && params.weapon) || 'buster';
    bossKey = (params && params.boss) || 'cut';
    line2 = G.weapons.BY_ID[weaponId].name + '!';
    G.fx.reset();
    G.input.visible = false;
    G.music.stop();
  }
  function exit() { G.input.visible = true; }

  function update() {
    t++;

    if (t === T_MORPH) {
      // 変身の瞬間
      A.sfx.explode();
      G.fx.flash('#FCFCFC', 12, 1);
      G.fx.ring(gfx.W / 2, gfx.H * 0.38, 4, 90, 26, G.weapons.BY_ID[weaponId].color, 2);
      G.fx.burst(gfx.W / 2, gfx.H * 0.38, 28, {
        speed: 3.6, life: 30, size: 3, light: true,
        colors: ['#FCFCFC', G.weapons.BY_ID[weaponId].color, G.weapons.BY_ID[weaponId].color2]
      });
      G.music.play('weaponget', { restart: true });
    }

    // 1文字ずつ表示（音つき）
    if (t >= T_TYPE) {
      var total = line1.length + line2.length;
      if (typed < total && (t - T_TYPE) % 4 === 0) {
        typed++;
        var ch = (typed <= line1.length) ? line1[typed - 1] : line2[typed - line1.length - 1];
        if (ch && ch !== ' ') A.sfx.blip();
        if (typed === total) A.sfx.pickup();
      }
    }

    // キラキラを漂わせる
    if (t > T_MORPH && t % 6 === 0) {
      G.fx.part({
        x: U.rndRange(0, gfx.W), y: gfx.H + 4,
        vx: U.rndRange(-0.3, 0.3), vy: -U.rndRange(0.5, 1.4),
        life: U.rndInt(60, 130), size: U.rndInt(1, 3),
        color: G.weapons.BY_ID[weaponId].color, color2: '#FCFCFC',
        type: 'star', light: true
      });
    }

    if (t > T_TYPE + 40) done = true;

    // 自動で戻る／タップでスキップ
    if ((done && t > 300) || (done && G.input.anyPressed)) {
      A.sfx.menuSelect();
      G.music.fadeOut(0.3);
      G.scene.go('select', null, { fade: 30 });
    }
  }

  function draw() {
    gfx.clear('#000008');

    // 中心から広がる光の筋（お祝い感）
    var ctx = gfx.ctx;
    if (t > T_MORPH) {
      ctx.save();
      ctx.globalAlpha = 0.16;
      ctx.globalCompositeOperation = 'lighter';
      var cx = gfx.W / 2, cy = gfx.H * 0.38;
      for (var i = 0; i < 12; i++) {
        var a = i / 12 * Math.PI * 2 + t * 0.006;
        gfx.line(cx, cy, cx + Math.cos(a) * 300, cy + Math.sin(a) * 300,
          G.weapons.BY_ID[weaponId].color, 3);
      }
      ctx.restore();
    }

    G.fx.draw(0, 0);

    var cx2 = gfx.W / 2, cy2 = gfx.H * 0.38;

    /* --- ボスの顔 → 武器アイコン --- */
    if (t >= T_FACE && t < T_MORPH) {
      var k = U.clamp((t - T_FACE) / 24, 0, 1);
      ctx.save();
      ctx.globalAlpha = k;
      // だんだん大きくなりながら現れる
      G.bosses.drawFace(bossKey, cx2, cy2, 48 + k * 8, false);
      ctx.restore();
      // 変身直前は震える
      if (t > T_MORPH - 14) {
        ctx.save();
        ctx.globalAlpha = 0.5;
        G.bosses.drawFace(bossKey, cx2 + U.rndRange(-2, 2), cy2 + U.rndRange(-2, 2), 52, false);
        ctx.restore();
      }
    } else if (t >= T_MORPH) {
      // 武器アイコンを大きく表示（少し弾んで登場）
      var kk = U.clamp((t - T_MORPH) / 20, 0, 1);
      var scale = 2.4 * U.ease.outBack(kk) + 1.2;
      var bob = Math.sin(t * 0.08) * 2;
      // 台座の光
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      gfx.circle(cx2, cy2 + bob, 30 + Math.sin(t * 0.1) * 3, '#101830');
      ctx.restore();
      G.weapons.drawIcon(weaponId, cx2, cy2 + bob, scale);
    }

    /* --- タイプライター文字 --- */
    if (t >= T_TYPE) {
      var n1 = Math.min(typed, line1.length);
      var n2 = Math.max(0, typed - line1.length);
      var s1 = line1.substring(0, n1);
      var s2 = line2.substring(0, n2);
      gfx.text(s1, cx2, gfx.H - 74, { align: 'center', scale: 2, color: '#FCFCFC', outline: '#101018' });
      if (n2 > 0) {
        gfx.text(s2, cx2, gfx.H - 48,
          { align: 'center', scale: 2, color: G.weapons.BY_ID[weaponId].color, outline: '#101018' });
      }
      // カーソル
      if (typed < line1.length + line2.length && Math.floor(t / 6) % 2 === 0) {
        var y = n2 > 0 ? gfx.H - 48 : gfx.H - 74;
        var wdt = gfx.textWidth(n2 > 0 ? s2 : s1, 2);
        gfx.rect(cx2 + wdt / 2 + 2, y, 8, 14, '#FCFCFC');
      }
    }

    if (done && Math.floor(t / 20) % 2 === 0) {
      gfx.text('TAP TO CONTINUE', cx2, gfx.H - 18, { align: 'center', color: '#7C88A0' });
    }

    G.fx.drawFlash();
    gfx.scanlines(0.12);
  }

  return { enter: enter, exit: exit, update: update, draw: draw };
})();


/* ===== src/scenes/ending.js ===== */
/* =========================================================================
   scenes/ending.js  --  全ボス撃破後のエンディング
   ========================================================================= */
G.scenes.ending = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio;

  var t = 0, scroll = 0;

  var CREDITS = [
    '', 'CONGRATULATIONS!', '',
    'ALL SIX ROBOT MASTERS',
    'HAVE BEEN DEFEATED.', '',
    'PEACE RETURNS TO THE CITY',
    'ONCE AGAIN.', '', '',
    '- WEAPONS ACQUIRED -', '',
    'THUNDER BEAM', 'FIRE STORM', 'ICE SLASHER',
    'HYPER BOMB', 'ROLLING CUTTER', 'SUPER ARM', '', '',
    '- STAFF -', '',
    'GAME DESIGN    CANVAS ACTION',
    'PROGRAMMING    CANVAS ACTION',
    'PIXEL ART      CANVAS ACTION',
    'CHIP MUSIC     WEB AUDIO API', '', '',
    'THANK YOU FOR PLAYING!', '', '', 'THE END', '', ''
  ];

  function enter() {
    t = 0; scroll = 0;
    G.fx.reset();
    G.input.visible = false;
    G.music.play('clear', { restart: true });
  }
  function exit() { G.input.visible = true; }

  function update() {
    t++;
    scroll += 0.36;

    // 花火のように爆発を上げる
    if (t % 44 === 0) {
      var x = U.rndRange(30, gfx.W - 30), y = U.rndRange(20, gfx.H * 0.5);
      G.fx.explode(x, y, 1.1, ['#FCFCFC', '#F8D878', '#3CBCFC', '#F878F8']);
      A.sfx.enemyPop();
    }
    if (t % 9 === 0) {
      G.fx.part({
        x: U.rndRange(0, gfx.W), y: gfx.H + 4,
        vx: U.rndRange(-0.2, 0.2), vy: -U.rndRange(0.3, 0.9),
        life: U.rndInt(90, 200), size: U.rndInt(1, 2), shrink: false,
        color: U.pick(['#3CBCFC', '#F8D878', '#FCFCFC'])
      });
    }

    // 曲が終わったらもう一度流す
    if (t % 900 === 300) G.music.play('clear', { restart: true });

    var total = CREDITS.length * 16 + gfx.H;
    if (scroll > total || (t > 120 && G.input.anyPressed)) {
      A.sfx.menuSelect();
      G.music.fadeOut(0.6);
      // 進行状況をリセットして最初から遊べるようにする
      G.game.reset();
      G.scene.go('title', null, { fade: 40 });
    }
  }

  function draw() {
    gfx.clear('#000018');
    G.stages.starfield(t * 0.4, 0, 60, 1, ['#FCFCFC', '#3CBCFC', '#F8D878']);
    G.fx.draw(0, 0);

    // 地平線に立つ主人公のシルエット
    var groundY = gfx.H - 26;
    gfx.rect(0, groundY, gfx.W, gfx.H - groundY, '#101028');
    gfx.rect(0, groundY, gfx.W, 2, '#3CBCFC');
    var pbox = G.sprites.player.idle;
    gfx.ctx.drawImage(pbox.r, Math.round(gfx.W / 2 - 8), Math.round(groundY - pbox.h));

    // クレジットのスクロール
    for (var i = 0; i < CREDITS.length; i++) {
      var y = gfx.H + i * 16 - scroll;
      if (y < -16 || y > groundY - 32) continue;   // 主人公に重ならない位置で消す
      var line = CREDITS[i];
      var isTitle = (line.indexOf('-') === 0) || line === 'CONGRATULATIONS!' || line === 'THE END';
      gfx.text(line, gfx.W / 2, y, {
        align: 'center',
        scale: isTitle ? 2 : 1,
        color: isTitle ? '#F8D878' : '#FCFCFC',
        shadow: '#101018'
      });
    }

    G.fx.drawFlash();
    gfx.scanlines(0.12);
  }

  return { enter: enter, exit: exit, update: update, draw: draw };
})();


/* ===== src/main.js ===== */
/* =========================================================================
   main.js  --  起動・シーン管理・メインループ

   ・固定タイムステップ(60Hz)＋アキュムレータで、
     120Hz端末でも処理落ち時でもゲーム速度が変わらないようにしている
   ・スローモー演出は「更新を間引く」ことで実現（描画は毎フレーム）
   ========================================================================= */
(function () {
  'use strict';

  /* ======================================================================
     ゲーム全体の進行データ（ステージをまたいで持ち越す）
     ====================================================================== */
  G.game = {
    cleared: {},                 // ボスkey -> true
    weapons: ['buster'],
    lives: 2,
    tanks: 0,
    ammo: {},
    reset: function () {
      this.cleared = {};
      this.weapons = ['buster'];
      this.lives = 2;
      this.tanks = 0;
      this.ammo = {};
      var list = G.weapons.WEAPONS;
      for (var i = 0; i < list.length; i++) this.ammo[list[i].id] = G.Player.MAX_AMMO;
    }
  };

  /* ======================================================================
     シーン管理（フェードで切り替え）
     ====================================================================== */
  G.scene = (function () {
    var cur = null, curName = '';
    var pending = null;
    var transT = 0, transDur = 0, swapped = false;

    function go(name, params, opts) {
      if (pending) return;                 // 遷移中の多重呼び出しは無視
      opts = opts || {};
      pending = { name: name, params: params || null };
      transDur = opts.fade === undefined ? 24 : opts.fade;
      transT = 0;
      swapped = false;
      if (transDur <= 0) doSwap();
    }

    function doSwap() {
      if (!pending) return;
      if (cur && cur.exit) cur.exit();
      curName = pending.name;
      cur = G.scenes[curName];
      G.input.consumeAll();                // 前シーンのタップが誤爆しないように
      if (cur && cur.enter) cur.enter(pending.params);
      pending = null;
      swapped = true;
    }

    function update() {
      if (pending) {
        transT++;
        if (!swapped && transT >= transDur / 2) doSwap();
      } else if (transT > 0) {
        transT++;
        if (transT >= transDur) { transT = 0; transDur = 0; }
      }
      if (cur && cur.update) cur.update();
    }

    function draw() {
      if (cur && cur.draw) cur.draw();
      // フェードの黒幕（中間で真っ黒になる三角波）
      if (transDur > 0) {
        var k = transT / transDur;
        var a = 1 - Math.abs(k * 2 - 1);
        G.gfx.veil('#000000', Math.min(1, a * 1.15));
      }
    }

    return {
      go: go, update: update, draw: draw,
      get name() { return curName; },
      get current() { return cur; },
      get transitioning() { return !!pending; }
    };
  })();

  /* ======================================================================
     メインループ
     ====================================================================== */
  var STEP = 1000 / 60;
  var acc = 0, last = 0, slowAcc = 0;
  var running = false;
  var fpsSamples = [], fps = 60;

  function frame(now) {
    if (!running) return;
    requestAnimationFrame(frame);

    var dt = now - last;
    last = now;
    if (dt > 250) dt = STEP;      // タブ復帰などの巨大な差分は無視
    acc += dt;

    // FPS 計測（デバッグ表示用）
    if (dt > 0) {
      fpsSamples.push(1000 / dt);
      if (fpsSamples.length > 30) fpsSamples.shift();
      fps = fpsSamples.reduce(function (a, b) { return a + b; }, 0) / fpsSamples.length;
    }

    var steps = 0;
    while (acc >= STEP && steps < 5) {
      acc -= STEP;
      steps++;

      G.input.update();

      // スローモー：timeScale の分だけ更新回数を間引く
      slowAcc += G.fx.timeScale;
      if (slowAcc >= 1) {
        slowAcc -= 1;
        G.fx.update();
        G.scene.update();
      }
    }
    if (steps >= 5) acc = 0;      // 追いつけない時は諦めてリセット

    G.scene.draw();
    if (G.debug) drawDebug();
  }

  function drawDebug() {
    G.gfx.text('FPS ' + Math.round(fps), G.gfx.W - 4, 4,
      { align: 'right', color: fps > 50 ? '#B8F818' : '#F87858', shadow: '#000' });
  }

  /* ======================================================================
     起動
     ====================================================================== */
  function boot() {
    // 埋め込み先に viewport メタが無い場合（別ページに差し込まれた時など）は
    // 自前で挿入する。これが無いと端末が仮想980px幅で描画してしまう
    if (!document.querySelector('meta[name="viewport"]')) {
      var mv = document.createElement('meta');
      mv.name = 'viewport';
      mv.content = 'width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover';
      document.head.appendChild(mv);
    }

    var canvas = document.getElementById('screen');
    G.gfx.init(canvas);
    G.sprites.build();
    G.input.bind(canvas);
    G.game.reset();

    var overlay = document.getElementById('boot');
    var started = false;

    function start() {
      if (started) return;
      started = true;
      // iOS はユーザー操作の中で音声を解禁する必要がある
      G.audio.unlock();
      overlay.style.display = 'none';
      running = true;
      last = performance.now();
      G.scene.go('title', null, { fade: 0 });
      requestAnimationFrame(frame);
    }

    overlay.addEventListener('touchstart', function (e) { e.preventDefault(); start(); }, { passive: false });
    overlay.addEventListener('mousedown', start);
    overlay.addEventListener('click', start);
    window.addEventListener('keydown', function (e) {
      if (!started) { start(); }
      // F1 でデバッグ表示（FPS）
      if (e.code === 'F1') { G.debug = !G.debug; e.preventDefault(); }
    });

    // タブが裏に回ったら音を止める（バッテリー節約＆復帰時の暴走防止）
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) {
        G.audio.chargeStop();
        G.music.duck(0);
      } else {
        G.music.duck(0.55);
        last = performance.now();
        acc = 0;
      }
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else boot();
})();


</script>
