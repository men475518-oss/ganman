     ジャンプの限界（歩き 1.35 / 空中 1.60 / 初速 4.9 / 重力 0.235）
       最高到達 48px = 3タイル ちょうど → 実際に「乗れる」のは 2タイルまで
       滞空中の水平移動 69px = 4.3タイル  → 穴は3タイルまでに抑える
     どちらも実測値より安全側に倒して「段差2・穴3」を上限にしている。
     数値を変えたら必ず tools/smoke.js reach を通すこと。
     ------------------------------------------------------------------ */
  var HOP = 2;      // 一度に登れる高さ（タイル）
  var GAP = 3;      // 一度に飛べる穴の幅（タイル）

  var PATTERNS = {
    /* 平地。敵とアイテム、たまに空中足場 */
    flat: function (S) {
      var len = U.rndInt(7, 11), i;
      for (i = 0; i < len; i++) {
        fillCol(S, S.x + i, S.gl);
        if (S.theme.iceFloor && U.rnd() < S.theme.iceFloor) put(S, S.x + i, S.gl, 'I');
      }
      populate(S, S.x + 2, S.x + len - 1, S.gl, U.rndInt(1, 2));
      // ときどき上に足場とごほうび
      if (U.rnd() < 0.4) {
        var px = S.x + Math.floor(len / 2);
        put(S, px, S.gl - HOP, '='); put(S, px + 1, S.gl - HOP, '=');
        S.items.push({ kind: U.rnd() < 0.18 ? 'oneUp' : 'wpSmall',
                       x: (px + 0.5) * T, y: (S.gl - HOP - 1) * T + 8 });
      } else maybeItem(S, S.x + 2, S.gl, 0.25);
      S.x += len;
    },

    /* 小さな穴（3タイルまで＝確実に飛び越えられる） */
    pit: function (S) {
      var pre = 3, w = U.rndInt(2, GAP), post = 3, i;
      for (i = 0; i < pre; i++) fillCol(S, S.x + i, S.gl);
      if (U.rnd() < 0.4) for (i = 0; i < w; i++) put(S, S.x + pre + i, LH - 1, '^');
      for (i = 0; i < post; i++) fillCol(S, S.x + pre + w + i, S.gl);
      spawnMixed(S, S.x + pre + w + 1, S.gl);
      S.x += pre + w + post;
    },

    /* 広い穴＋飛び石（石は必ず 2タイル以内の高さ・3タイル以内の間隔） */
    bigPit: function (S) {
      var pre = 3, w = U.rndInt(6, 9), post = 3, i;
      for (i = 0; i < pre; i++) fillCol(S, S.x + i, S.gl);
      for (i = 0; i < w; i++) put(S, S.x + pre + i, LH - 1, '^');
      // 3タイルおきに幅2の足場を置いて渡らせる
      var px = S.x + pre + 2;
      while (px < S.x + pre + w - 1) {
        put(S, px, S.gl - 1, '=');
        put(S, px + 1, S.gl - 1, '=');
        px += 3;
      }
      for (i = 0; i < post; i++) fillCol(S, S.x + pre + w + i, S.gl);
      S.x += pre + w + post;
    },

    /* 段差を登る（1段 2タイル） */
    stepUp: function (S) {
      var steps = U.rndInt(1, 2), s, i;
      for (s = 0; s < steps; s++) {
        if (S.gl <= 8) break;
        S.gl -= HOP;
        var len = U.rndInt(4, 6);
        for (i = 0; i < len; i++) fillCol(S, S.x + i, S.gl);
        populate(S, S.x + 1, S.x + len, S.gl, 1);
        S.x += len;
      }
    },

    /* 段差を降りる */
    stepDown: function (S) {
      var steps = U.rndInt(1, 2), s, i;
      for (s = 0; s < steps; s++) {
        if (S.gl >= GY) break;
        S.gl += HOP;
        var len = U.rndInt(4, 6);
        for (i = 0; i < len; i++) fillCol(S, S.x + i, S.gl);
        populate(S, S.x + 1, S.x + len, S.gl, 1);
        S.x += len;
      }
    },

    /* 足場を階段状に登る（各段 2タイルずつ） */
    platforms: function (S) {
      var len = 12, i;
      for (i = 0; i < len; i++) fillCol(S, S.x + i, S.gl);
      // 2タイルずつ上げていく＝必ず届く
      put(S, S.x + 2, S.gl - HOP, '=');     put(S, S.x + 3, S.gl - HOP, '=');
      put(S, S.x + 6, S.gl - HOP * 2, '='); put(S, S.x + 7, S.gl - HOP * 2, '=');
      put(S, S.x + 10, S.gl - HOP, '=');    put(S, S.x + 11, S.gl - HOP, '=');
      // 一番上にごほうび
      S.items.push({ kind: U.rnd() < 0.3 ? 'oneUp' : 'hpBig',
                     x: (S.x + 6.5) * T, y: (S.gl - HOP * 2 - 1) * T + 8 });
      S.spawns.push({ type: 'fly', x: (S.x + 5) * T, y: (S.gl - HOP * 2 - 3) * T, opts: {} });
      populate(S, S.x + 1, S.x + len, S.gl, 1);
      S.x += len;
    },

    /* トゲ地帯：2タイル上の足場を渡っていく */
    spikeRun: function (S) {
      var pre = 3, w = U.rndInt(5, 8), post = 3, i;
      for (i = 0; i < pre; i++) fillCol(S, S.x + i, S.gl);
      for (i = 0; i < w; i++) {
        fillCol(S, S.x + pre + i, S.gl + 1);
        put(S, S.x + pre + i, S.gl, '^');
      }
      // 足場は 2タイル上・3タイル間隔（跳んで渡れる配置）
      for (i = 1; i < w; i += 3) {
        put(S, S.x + pre + i, S.gl - HOP, '=');
        put(S, S.x + pre + i + 1, S.gl - HOP, '=');
      }
      for (i = 0; i < post; i++) fillCol(S, S.x + pre + w + i, S.gl);
      S.x += pre + w + post;
    },

    /* はしごで上の階へ（上には砲台とごほうび） */
    ladder: function (S) {
      var len = 13, i, y;
      var upper = Math.max(4, S.gl - 6);
      for (i = 0; i < len; i++) fillCol(S, S.x + i, S.gl);
      // 上の階の床
      for (i = 4; i < len - 1; i++) {
        put(S, S.x + i, upper, '#');
        put(S, S.x + i, upper + 1, '#');
      }
      // はしご（上の階の床の高さから、下の地面まで通す）
      var lx = S.x + 3;
      for (y = upper; y < S.gl; y++) put(S, lx, y, 'L');
      // 上の階のごほうびと敵
      S.spawns.push({ type: 'turret', x: (S.x + 9) * T, y: (upper - 1) * T + 4, opts: {} });
      S.items.push({ kind: U.rnd() < 0.35 ? 'eTank' : 'wpBig',
                     x: (S.x + 11) * T, y: (upper - 1) * T + 8 });
      populate(S, S.x + 5, S.x + len, S.gl, 1);
      S.x += len;
    },

    /* 低い天井の通路（ジャンプできないのでメットールが厄介） */
    corridor: function (S) {
      var len = U.rndInt(7, 10), i, y;
      for (i = 0; i < len; i++) {
        fillCol(S, S.x + i, S.gl);
        for (y = 0; y < S.gl - 4; y++) put(S, S.x + i, y, '#');
      }
      for (i = 2; i < len - 1; i += 3) addEnemy(S, 'met', S.x + i, S.gl);
      maybeItem(S, S.x + 1, S.gl, 0.4);
      S.x += len;
    },

    /* 壊せるブロックの壁（スーパーアームの岩で破壊できる）

       重要：高さは必ず2タイル(32px)までにする。
       ジャンプの最高到達は48pxなので、3タイル以上にすると
       スーパーアームを持っていないプレイヤーが詰んでしまう。
       壊すのはあくまで近道であって、乗り越えても先へ進める。          */
    breakWall: function (S) {
      var len = 11, i, y;
      for (i = 0; i < len; i++) fillCol(S, S.x + i, S.gl);
      var bx = S.x + 4;
      for (y = S.gl - 2; y < S.gl; y++) {
        put(S, bx, y, 'B'); put(S, bx + 1, y, 'B'); put(S, bx + 2, y, 'B');
      }
      // 壁の向こう側にごほうび
      S.items.push({ kind: 'eTank', x: (S.x + 8) * T, y: (S.gl - 1) * T + 8 });
      populate(S, S.x + 1, S.x + 3, S.gl, 1);
      S.x += len;
    },

    /* 動く足場で大穴を渡る */
    movingGap: function (S) {
      var pre = 3, w = 8, post = 3, i;
      for (i = 0; i < pre; i++) fillCol(S, S.x + i, S.gl);
      for (i = 0; i < w; i++) put(S, S.x + pre + i, LH - 1, '^');
      S.spawns.push({ type: 'plat',
        x: (S.x + pre + 1) * T, y: (S.gl - 1) * T,
        opts: { w: 44, ax: (w - 3) * T * 0.5, ay: 0, spd: 0.016 } });
      for (i = 0; i < post; i++) fillCol(S, S.x + pre + w + i, S.gl);
      spawnMixed(S, S.x + pre + w + 1, S.gl);
      S.x += pre + w + post;
    },

    /* 縦に高い区間：足場を交互に配置して登る */
    tower: function (S) {
      var len = 10, i;
      for (i = 0; i < len; i++) fillCol(S, S.x + i, S.gl);
      // 左右交互に 2タイルずつ上げる
      var y = S.gl - HOP, side = 0, n = 0;
      while (y > 4 && n < 4) {
        var bx = S.x + (side ? len - 5 : 2);
        put(S, bx, y, '='); put(S, bx + 1, y, '='); put(S, bx + 2, y, '=');
        y -= HOP; side ^= 1; n++;
      }
      S.items.push({ kind: 'hpBig', x: (S.x + len / 2) * T, y: (y + HOP - 1) * T + 8 });
      S.spawns.push({ type: 'fly', x: (S.x + len / 2) * T, y: (S.gl - 5) * T, opts: {} });
      populate(S, S.x + 1, S.x + len, S.gl, 1);
      S.x += len;
    }
  };

  /* 出現しやすさ（数字が大きいほどよく出る） */
  var WEIGHTS = {
    flat: 5, pit: 4, platforms: 3, stepUp: 3, stepDown: 3,
    spikeRun: 2, ladder: 3, corridor: 2, bigPit: 2, movingGap: 2, tower: 3,
    breakWall: 3
  };
  function pickPattern(names) {
    var total = 0, i;
    for (i = 0; i < names.length; i++) total += WEIGHTS[names[i]] || 1;
    var r = U.rnd() * total;
    for (i = 0; i < names.length; i++) {
      r -= (WEIGHTS[names[i]] || 1);
      if (r <= 0) return names[i];
    }
    return names[0];
  }

  /* ======================================================================
     ステージ生成
     ====================================================================== */
  var RISKY = { pit: 1, bigPit: 1, spikeRun: 1, movingGap: 1 };

  function build(key) {
    var theme = THEMES[key];
    U.seed(theme.seed);

    // 全部空白で初期化
    var g = [], y, x;
    for (y = 0; y < LH; y++) {
      var row = [];
      for (x = 0; x < LW; x++) row.push('.');
      g.push(row);
    }

    var S = { g: g, x: 0, gl: GY, spawns: [], items: [], theme: theme };

    /* --- スタート地帯（安全な平地） --- */
    for (x = 0; x < 12; x++) fillCol(S, x, GY);
    S.x = 12;
    var playerStart = { x: 4 * T + 8, y: GY * T };

    /* --- 中盤：パターンを並べる --- */
    var names = ['flat', 'pit', 'platforms', 'stepUp', 'spikeRun',
                 'stepDown', 'ladder', 'bigPit', 'corridor', 'movingGap', 'tower'];
    if (theme.breakable) names.push('breakWall');

    var endX = LW - ARENA_W - 16;
    var checkpoint = null;
    var last = '';
    var guard = 0;
    var needBreak = !!theme.breakable;   // 壊せるブロックを必ず1回は出す

    while (S.x < endX && guard++ < 300) {
      var n = pickPattern(names);
      // ステージ中盤に来てもまだ出ていなければ強制的に配置する
      if (needBreak && S.x > LW * 0.34 && endX - S.x > 20) { n = 'breakWall'; needBreak = false; }
      else if (n === 'breakWall') needBreak = false;
      // 同じパターンの連続と、危険パターンの連続は避ける
      if (n === last) n = 'flat';
      if (RISKY[last] && RISKY[n]) n = 'flat';
      // 残り幅が足りないなら平地で埋める
      if (endX - S.x < 14) n = 'flat';
      // 高いところで tower/platforms を始めると天井を突き抜けるので調整
      if ((n === 'tower' || n === 'platforms') && S.gl < 11) n = 'stepDown';
      PATTERNS[n](S);
      last = n;

      // 中間ポイント（半分を過ぎた最初の安全な平地）
      if (!checkpoint && S.x > LW * 0.46 && n === 'flat') {
        checkpoint = { x: (S.x - 4) * T, y: S.gl * T };
        S.items.push({ kind: 'hpBig', x: (S.x - 6) * T, y: (S.gl - 1) * T + 8 });
      }
    }

    /* --- 地面の高さを基準に戻してボス前の通路へ --- */
    while (S.gl < GY) {
      S.gl += HOP;
      for (x = 0; x < 3; x++) fillCol(S, S.x + x, S.gl);
      S.x += 3;
    }
    S.gl = GY;
    while (S.x < LW - ARENA_W - 2) { fillCol(S, S.x, S.gl); S.x++; }

    // ボス前の補給ゾーン
    S.items.push({ kind: 'hpBig', x: (LW - ARENA_W - 9) * T, y: (GY - 1) * T + 8 });
    S.items.push({ kind: 'wpBig', x: (LW - ARENA_W - 6) * T, y: (GY - 1) * T + 8 });

    /* --- 扉とボス部屋 --- */
    var doorTx = LW - ARENA_W - 2;
    var arenaTx0 = LW - ARENA_W;
    var arenaTx1 = LW - 2;

    // 扉（幅2・高さ4）とその上の壁
    for (y = GY - 4; y < GY; y++) { g[y][doorTx] = 'D'; g[y][doorTx + 1] = 'D'; }
    for (y = 0; y < GY - 4; y++) { g[y][doorTx] = '#'; g[y][doorTx + 1] = '#'; }
    fillCol(S, doorTx, GY); fillCol(S, doorTx + 1, GY);

    // アリーナの床と天井
    for (x = arenaTx0; x <= arenaTx1 + 1 && x < LW; x++) {
      fillCol(S, x, GY);
      for (y = 0; y < 3; y++) g[y][x] = '#';
    }
    // 右端の壁
    for (y = 0; y < GY; y++) {
      if (arenaTx1 + 1 < LW) g[y][arenaTx1 + 1] = '#';
      g[y][LW - 1] = '#';
    }

    /* --- 文字列に変換 --- */
    var rows = [];
    for (y = 0; y < LH; y++) rows.push(g[y].join(''));

    return {
      key: key,
      theme: theme,
      rows: rows,
      w: LW, h: LH,
      playerStart: playerStart,
      spawns: S.spawns,
      items: S.items,
      checkpoint: checkpoint || { x: ((LW * 0.5) | 0) * T, y: GY * T },
      boss: {
        key: key,
        doorX: doorTx * T,
        triggerX: (doorTx - 1) * T,
        arena: { x0: arenaTx0 * T, x1: (arenaTx1 + 1) * T, floorY: GY * T },
        spawnX: (arenaTx0 + ARENA_W - 8) * T,
        spawnY: GY * T
      }
    };
  }

  return {
    THEMES: THEMES, build: build,
    LW: LW, LH: LH, GY: GY, ARENA_W: ARENA_W,
    hash: hash, starfield: starfield, skyline: skyline
  };
})();


/* ===== src/game/weapons.js ===== */
/* =========================================================================
   weapons.js  --  武器と弾

   武器を増やすときは
     1) WEAPONS 配列に定義を足す
     2) SHOOTERS に発射処理を足す
   の2箇所だけ。弾の挙動はコンストラクタごとに分けてある。

   弾が共通で持つもの:
     x,y,w,h / vx,vy / dmg / team('player'|'enemy') / element / pierce
     update(st) / draw(cx,cy) / hitbox() / dead
   ========================================================================= */
G.weapons = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio, TL = G.tiles;

  /* ======================================================================
     武器の定義表
     ====================================================================== */
  var WEAPONS = [
    { id:'buster',  name:'MEGA BUSTER',    short:'MB', color:'#3CBCFC', color2:'#FCFCFC',
      max: Infinity, cost: 0, charge: true },
    { id:'thunder', name:'THUNDER BEAM',   short:'TB', color:'#F8D878', color2:'#FCFCFC',
      max: 28, cost: 3 },
    { id:'fire',    name:'FIRE STORM',     short:'FS', color:'#FC9838', color2:'#F87858',
      max: 28, cost: 3 },
    { id:'ice',     name:'ICE SLASHER',    short:'IS', color:'#BCE8FC', color2:'#3CBCFC',
      max: 28, cost: 2 },
    { id:'bomb',    name:'HYPER BOMB',     short:'HB', color:'#00A800', color2:'#B8F818',
      max: 28, cost: 4 },
    { id:'cutter',  name:'ROLLING CUTTER', short:'RC', color:'#BCBCBC', color2:'#00E8D8',
      max: 28, cost: 2 },
    { id:'arm',     name:'SUPER ARM',      short:'SA', color:'#8C4A20', color2:'#D8A860',
      max: 28, cost: 5 }
  ];
  var BY_ID = {};
  WEAPONS.forEach(function (w, i) { w.index = i; BY_ID[w.id] = w; });

  /* ======================================================================
     弾の共通ベース
     ====================================================================== */
  function Base(x, y, w, h, vx, vy, opt) {
    opt = opt || {};
    this.x = x - w / 2; this.y = y - h / 2;
    this.w = w; this.h = h;
    this.vx = vx; this.vy = vy;
    this.dmg = opt.dmg || 1;
    this.team = opt.team || 'player';
    this.element = opt.element || 'buster';
    this.pierce = !!opt.pierce;
    this.life = opt.life || 240;
    this.grav = opt.grav || 0;
    this.hitsWall = opt.hitsWall !== false;   // 壁で消えるか
    this.dead = false;
    this.age = 0;
    this.color = opt.color || '#FCFCFC';
    this.freeze = opt.freeze || 0;            // 敵を凍らせるフレーム数
    this.knock = opt.knock || 0;
  }
  Base.prototype.hitbox = function () { return { x: this.x, y: this.y, w: this.w, h: this.h }; };
  Base.prototype.cx = function () { return this.x + this.w / 2; };
  Base.prototype.cy = function () { return this.y + this.h / 2; };
  Base.prototype.baseStep = function () {
    this.age++;
    this.x += this.vx; this.y += this.vy;
    this.vy += this.grav;
    if (--this.life <= 0) this.dead = true;
    // 画面から大きく離れたら消す（メモリ節約）
    var lv = TL.getLevel();
    if (lv && (this.x < -64 || this.x > lv.pxW + 64 || this.y > lv.pxH + 64 || this.y < -160)) this.dead = true;
  };
  Base.prototype.wallCheck = function () {
    if (!this.hitsWall) return false;
    if (TL.boxSolid(this.x, this.y, this.w, this.h)) {
      this.dead = true;
      G.fx.ricochet(this.cx(), this.cy(), this.color);
      return true;
    }
    return false;
  };
  // 敵に当たった時に呼ばれる。true を返すと弾が消える
  Base.prototype.onHit = function () { return !this.pierce; };
  Base.prototype.draw = function (cx, cy) {
    gfx.rect(this.x - cx, this.y - cy, this.w, this.h, this.color);
  };

  function extend(Ctor) {
    Ctor.prototype = Object.create(Base.prototype);
    Ctor.prototype.constructor = Ctor;
    return Ctor;
  }

  /* ======================================================================
     ① メガバスター（通常＋チャージ）
     ====================================================================== */
  var Buster = extend(function (x, y, dir, level) {
    var size = level === 0 ? 6 : (level === 1 ? 12 : 18);
    var dmg  = level === 0 ? 1 : (level === 1 ? 3 : 6);
    Base.call(this, x, y, size, size, dir * 5.6, 0, {
      dmg: dmg, element: 'buster', color: level === 0 ? '#3CBCFC' : '#BCE8FC',
      knock: level === 2 ? 2 : 0
    });
    this.level = level;
    this.dir = dir;
  });
  Buster.prototype.update = function () {
    this.baseStep();
    this.wallCheck();
    // チャージ弾は尾を引く
    if (this.level > 0 && this.age % 2 === 0) {
      G.fx.part({ x: this.cx() - this.dir * 4, y: this.cy() + U.rndRange(-3, 3),
        vx: -this.dir * 0.4, vy: 0, life: 10, size: this.level === 2 ? 4 : 2,
        color: '#FCFCFC', color2: '#3CBCFC', type: 'circle', light: true });
    }
  };
  Buster.prototype.draw = function (cx, cy) {
    var x = this.cx() - cx, y = this.cy() - cy;
    if (this.level === 0) {
      // 小さな弾：中心が白、周りが水色
      gfx.rect(x - 3, y - 2, 6, 4, '#3CBCFC');
      gfx.rect(x - 2, y - 1, 4, 2, '#FCFCFC');
    } else if (this.level === 1) {
      gfx.circle(x, y, 6, '#0058F8');
      gfx.circle(x, y, 4, '#3CBCFC');
      gfx.circle(x, y, 2, '#FCFCFC');
    } else {
      var pulse = (this.age % 6 < 3) ? 1 : 0;
      gfx.circle(x, y, 9 + pulse, '#0058F8');
      gfx.circle(x, y, 7, '#3CBCFC');
      gfx.circle(x, y, 4, '#BCE8FC');
      gfx.circle(x, y, 2, '#FCFCFC');
      // 前方に伸びる衝撃線
      gfx.rect(x + this.dir * 6, y - 1, this.dir * 8, 2, '#BCE8FC');
    }
  };

  /* ======================================================================
     ② サンダービーム（貫通・縦にも走る）
     ====================================================================== */
  var Thunder = extend(function (x, y, dir, vertical) {

  /* ======================================================================

  var Bomb = extend(function (x, y, dir) {

  Bomb.prototype.explodeNow = function (st) {

  Bomb.prototype.update = function (st) {
    this.baseStep();
    // 地形にぶつかったら止まって転がる
    if (TL.boxSolid(this.x, this.y + this.h * 0.5, this.w, this.h * 0.5) && this.vy > 0) {
      this.y = Math.floor((this.y + this.h) / TL.T) * TL.T - this.h - 0.01;
      this.vy = -this.vy * 0.28;
      this.vx *= 0.6;
      if (Math.abs(this.vy) < 0.6) this.vy = 0;
    }
    if (TL.boxSolid(this.x + this.vx, this.y, this.w, this.h * 0.6)) this.vx = -this.vx * 0.4;

  Bomb.prototype.draw = function (cx, cy) {

  /* --- 爆風（範囲ダメージ）：爆弾/岩/ボスの大技で共用 --- */
  var Blast = extend(function (x, y, radius, dmg, element, team) {

  Blast.prototype.update = function () {

  Blast.prototype.onHit = function () { return false; };
  Blast.prototype.draw = function (cx, cy) {

    var a = 1 - this.age / this.life;
    var ctx = gfx.ctx;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.globalCompositeOperation = 'lighter';
    gfx.circle(this.cx() - cx, this.cy() - cy, r * 0.9, '#D82800');
    gfx.circle(this.cx() - cx, this.cy() - cy, r * 0.6, '#FC9838');
    gfx.circle(this.cx() - cx, this.cy() - cy, r * 0.3, '#FCE0A8');
    ctx.restore();
  };

  /* ======================================================================
     ⑥ ローリングカッター（ブーメラン）
     ====================================================================== */
  var Cutter = extend(function (x, y, dir, owner) {
    Base.call(this, x, y, 14, 14, dir * 5.0, -1.2, {
      dmg: 3, element: 'cutter', pierce: true, color: '#BCBCBC', hitsWall: false, life: 200
    });
    this.dir = dir; this.owner = owner;
    this.phase = 'out';
    this.spin = 0;
  });
  Cutter.prototype.update = function () {
    this.age++;
    this.spin += 0.6;
    if (this.phase === 'out') {
      this.x += this.vx; this.y += this.vy;
      this.vy += 0.045;
      if (this.age > 34) this.phase = 'back';
    } else {
      // 使い手のところへ戻ってくる
      var tx = this.owner.cx(), ty = this.owner.cy();
      var a = Math.atan2(ty - this.cy(), tx - this.cx());
      var sp = 6.2;
      this.x += Math.cos(a) * sp; this.y += Math.sin(a) * sp;
      if (U.dist(this.cx(), this.cy(), tx, ty) < 14) this.dead = true;
    }
    if (--this.life <= 0) this.dead = true;
  };
  Cutter.prototype.draw = function (cx, cy) {
    var x = this.cx() - cx, y = this.cy() - cy;
    var ctx = gfx.ctx;
    ctx.save();
    ctx.translate(Math.round(x), Math.round(y));
    ctx.rotate(this.spin);
    // 三日月型のカッター
    ctx.fillStyle = '#101018'; ctx.fillRect(-8, -8, 16, 16);
    ctx.fillStyle = '#BCBCBC'; ctx.fillRect(-7, -7, 14, 14);
    ctx.fillStyle = '#FCFCFC'; ctx.fillRect(-7, -7, 14, 3);
    ctx.fillStyle = '#00E8D8'; ctx.fillRect(-4, -4, 8, 8);
    ctx.fillStyle = '#101018'; ctx.fillRect(-2, -2, 4, 4);
    ctx.restore();
  };

  /* ======================================================================
     ⑦ スーパーアーム（岩を投げる：ブロックも壊せる）
     ====================================================================== */
  var Rock = extend(function (x, y, dir) {
    Base.call(this, x, y, 18, 18, dir * 4.2, -1.6, {
      dmg: 6, element: 'arm', color: '#8C4A20', grav: 0.16, pierce: true
    });
    this.dir = dir; this.spin = 0;
  });
  Rock.prototype.update = function (st) {
    this.baseStep();
    this.spin += 0.22 * this.dir;
    if (TL.boxSolid(this.x, this.y, this.w, this.h)) {
      // 壊せるブロックなら破壊
      var t = TL.T;
      var tx0 = Math.floor(this.x / t), tx1 = Math.floor((this.x + this.w - 1) / t);
      var ty0 = Math.floor(this.y / t), ty1 = Math.floor((this.y + this.h - 1) / t);
      var broke = false;
      for (var ty = ty0; ty <= ty1; ty++) for (var tx = tx0; tx <= tx1; tx++) {

      }

      this.dead = true;

      G.fx.shake(2, 8);

  Rock.prototype.onHit = function () { return true; };
  Rock.prototype.draw = function (cx, cy) {

    ctx.fillStyle = '#8C4A20'; ctx.fillRect(-8, -8, 16, 16);
    ctx.fillStyle = '#D8A860'; ctx.fillRect(-8, -8, 16, 3);
    ctx.fillStyle = '#D8A860'; ctx.fillRect(-8, -8, 3, 16);

  /* ======================================================================
     敵/ボスの汎用弾
     ====================================================================== */
  var EnemyShot = extend(function (x, y, vx, vy, opt) {
    opt = opt || {};
    var s = opt.size || 8;
    Base.call(this, x, y, s, s, vx, vy, {
      dmg: opt.dmg || 2, team: 'enemy', element: opt.element || 'enemy',
      color: opt.color || '#F8D878', grav: opt.grav || 0,
      hitsWall: opt.hitsWall !== false, life: opt.life || 300
    });
    this.style = opt.style || 'ball';

    this.spin = 0;
    this.homing = opt.homing || 0;
  });
  EnemyShot.prototype.update = function (st) {
    if (this.homing && st && st.player && this.age < 60) {
      var a = Math.atan2(st.player.cy() - this.cy(), st.player.cx() - this.cx());
      var sp = Math.sqrt(this.vx * this.vx + this.vy * this.vy);
      this.vx = U.lerp(this.vx, Math.cos(a) * sp, this.homing);
      this.vy = U.lerp(this.vy, Math.sin(a) * sp, this.homing);

  EnemyShot.prototype.draw = function (cx, cy) {
    var x = this.cx() - cx, y = this.cy() - cy, r = this.w / 2;
    var ctx = gfx.ctx;
    if (this.style === 'ball') {

    } else if (this.style === 'spark') {
      ctx.save(); ctx.globalCompositeOperation = 'lighter';

      gfx.circle(x, y, r + 1, '#D82800');
      gfx.circle(x, y, r - 1, '#FC9838');
      gfx.circle(x, y, Math.max(1, r - 3), '#FCE0A8');

    } else if (this.style === 'shard') {
      ctx.save();
      ctx.translate(Math.round(x), Math.round(y));
      ctx.rotate(Math.atan2(this.vy, this.vx));
      ctx.fillStyle = '#3CBCFC'; ctx.fillRect(-r, -r / 2, r * 2, r);
      ctx.fillStyle = '#BCE8FC'; ctx.fillRect(-r + 1, -r / 2 + 1, r * 2 - 2, r - 2);

      ctx.restore();
    } else if (this.style === 'blade') {
      ctx.save();

    }
  };

  /* ======================================================================
     発射処理（武器ごと）
     戻り値：実際に撃てたら true
     ====================================================================== */
  var SHOOTERS = {
    buster: function (pl, st, chargeLevel) {
      // 画面内のバスター弾は3発まで（原作準拠）
      var n = 0;
      for (var i = 0; i < st.shots.length; i++) {
        if (st.shots[i] instanceof Buster && st.shots[i].level === 0) n++;
      }
      if (chargeLevel === 0 && n >= 3) return false;
      var p = pl.muzzle();
      st.shots.push(new Buster(p.x, p.y, pl.face, chargeLevel));
      if (chargeLevel === 0) A.sfx.shot();
      else if (chargeLevel === 1) A.sfx.shotMid();
      else { A.sfx.shotBig(); G.fx.shake(1.5, 6); }
      G.fx.burst(p.x, p.y, chargeLevel === 2 ? 8 : 3, {
        speed: 1.4, life: 10, size: 2, color: '#BCE8FC', light: true });
      return true;
    },

    thunder: function (pl, st) {
      var p = pl.muzzle();
      st.shots.push(new Thunder(p.x, p.y, pl.face, 0));
      st.shots.push(new Thunder(p.x, p.y, pl.face, -1));
      st.shots.push(new Thunder(p.x, p.y, pl.face, 1));
      A.sfx.thunder();
      G.fx.flash('#F8D878', 3, 0.22);
      return true;
    },

    fire: function (pl, st) {
      var p = pl.muzzle();
      st.shots.push(new Fire(p.x, p.y, pl.face));
      st.shots.push(new FireShield(pl));
      A.sfx.fire();
      return true;
    },

    ice: function (pl, st) {
      var p = pl.muzzle();
      st.shots.push(new Ice(p.x, p.y, pl.face));
      A.sfx.ice();
      return true;
    },

    bomb: function (pl, st) {
      var p = pl.muzzle();
      st.shots.push(new Bomb(p.x, p.y - 4, pl.face));
      A.sfx.bombThrow();
      return true;
    },

    cutter: function (pl, st) {
      // 戻ってくるまで次を撃てない
      for (var i = 0; i < st.shots.length; i++) if (st.shots[i] instanceof Cutter) return false;
      var p = pl.muzzle();
      st.shots.push(new Cutter(p.x, p.y, pl.face, pl));
      A.sfx.cutter();
      return true;
    },

    arm: function (pl, st) {
      for (var i = 0; i < st.shots.length; i++) if (st.shots[i] instanceof Rock) return false;
      var p = pl.muzzle();
      st.shots.push(new Rock(p.x + pl.face * 6, p.y - 2, pl.face));
      A.sfx.rockThrow();
      G.fx.shake(1.5, 6);
      return true;
    }
  };

  /* 実際に呼ぶ入口。弾数チェックとエネルギー消費もここで行う */
  function fire(pl, st, weaponId, chargeLevel) {
    var def = BY_ID[weaponId];
    if (!def) return false;
    var cost = (weaponId === 'buster') ? 0 : def.cost;
    if (cost > 0 && pl.ammo[weaponId] < cost) { A.sfx.deny(); return false; }
    var did = SHOOTERS[weaponId](pl, st, chargeLevel || 0);
    if (did && cost > 0) {
      pl.ammo[weaponId] = Math.max(0, pl.ammo[weaponId] - cost);
    }
    return did;
  }

  /* ======================================================================
     武器アイコン（HUD・武器ゲット画面・ポーズメニューで共用）
     ====================================================================== */
  function drawIcon(id, x, y, s) {
    s = s || 1;
    var ctx = gfx.ctx;
    function R(dx, dy, w, h, c) { gfx.rect(x + dx * s, y + dy * s, w * s, h * s, c); }
    function C(dx, dy, r, c) { gfx.circle(x + dx * s, y + dy * s, r * s, c); }
    switch (id) {
      case 'buster':
        R(-7, -3, 14, 7, '#101018'); R(-6, -2, 12, 5, '#3CBCFC');
        R(-6, -2, 12, 2, '#BCE8FC'); R(4, -1, 3, 3, '#FCFCFC');
        break;
      case 'thunder':
        R(-1, -8, 3, 6, '#F8D878'); R(-4, -2, 3, 5, '#FCFCFC');
        R(0, 1, 3, 6, '#F8D878');   R(2, -4, 3, 5, '#FCFCFC');
        R(-6, -1, 3, 3, '#F8D878'); R(4, 0, 3, 3, '#F8D878');
        break;
      case 'fire':
        C(0, 2, 6, '#D82800'); C(0, 2, 4, '#FC9838'); C(0, 3, 2, '#FCE0A8');
        R(-2, -7, 2, 5, '#FC9838'); R(1, -6, 2, 4, '#D82800');
        break;
      case 'ice':
        R(-8, -2, 16, 5, '#3CBCFC'); R(-7, -1, 14, 3, '#BCE8FC');
        R(4, -1, 5, 2, '#FCFCFC');   R(-8, -1, 4, 2, '#FCFCFC');
        break;
      case 'bomb':
        C(0, 2, 6, '#101018'); C(0, 2, 5, '#00A800'); C(-2, 0, 2, '#B8F818');
        R(-1, -7, 2, 4, '#8C4A20'); R(0, -9, 2, 2, '#FCE0A8');
        break;
      case 'cutter':
        R(-7, -7, 14, 14, '#101018'); R(-6, -6, 12, 12, '#BCBCBC');
        R(-6, -6, 12, 3, '#FCFCFC');  R(-3, -3, 6, 6, '#00E8D8');
        R(-1, -1, 2, 2, '#101018');
        break;
      case 'arm':
        R(-7, -6, 14, 12, '#101018'); R(-6, -5, 12, 10, '#8C4A20');
        R(-6, -5, 12, 3, '#D8A860');  R(-2, 0, 4, 2, '#5C2A10');
        R(2, -3, 3, 2, '#5C2A10');
        break;
    }
  }

  return {
    WEAPONS: WEAPONS, BY_ID: BY_ID,
    fire: fire, drawIcon: drawIcon,
    Buster: Buster, Thunder: Thunder, Fire: Fire, FireShield: FireShield,
    Ice: Ice, Bomb: Bomb, Blast: Blast, Cutter: Cutter, Rock: Rock,
    EnemyShot: EnemyShot, Base: Base, extend: extend
  };
})();


/* ===== src/game/player.js ===== */
/* =========================================================================
   player.js  --  主人公「ガンマン」

   操作感は原作(ファミコン版)の数値に寄せてある：
     歩行速度 1.35px/F ／ ジャンプ初速 -4.9 ／ 重力 0.25 ／ 落下上限 7
     加速度は付けない（押した瞬間に最高速＝キビキビした操作感）
   ========================================================================= */
G.Player = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio, TL = G.tiles, W = G.weapons;

  /* ---------------- 調整用の定数（ここをいじれば挙動が変わる） ----------------

     ジャンプの「飛距離」と「高さ」は別々に効く量で決まる：
       高さ   = JUMP_V^2 / (2 * GRAV)
       滞空   = 2 * JUMP_V / GRAV
       飛距離 = 横速度 * 滞空
     重力やジャンプ初速をいじると高さの方が大きく伸びてしまうので、
     飛距離だけを伸ばしたいときは AIR（空中の横速度）を上げる。       */
  var WALK      = 1.35;   // 地上の歩行速度
  var AIR       = 1.60;   // 空中の横移動速度。歩行より少し速く、跳ぶと遠くまで届く
  var JUMP_V    = -4.90;
  var GRAV      = 0.235;  // 少しだけ軽くして滞空時間を伸ばしている
  var MAX_FALL  = 7.0;
  var CLIMB_SP  = 1.20;
  var ICE_ACCEL = 0.09;   // 氷の上での加速
  var ICE_FRIC  = 0.985;  // 氷の上での減速（1に近いほど滑る）
  var HURT_TIME = 22;     // のけぞって動けない時間
  var INVUL     = 84;     // 無敵時間
  var CHARGE_1  = 30;     // ここからチャージ段階1
  var CHARGE_2  = 68;     // ここから最大チャージ
  var MAX_HP    = 28;
  var MAX_AMMO  = 28;

  function Player(x, y) {
    this.w = 12; this.h = 22;
    this.x = x - this.w / 2;
    this.y = y - this.h;
    this.vx = 0; this.vy = 0;
    this.face = 1;

    this.hp = MAX_HP;
    this.maxHp = MAX_HP;
    this.lives = 2;

    this.state = 'idle';     // idle/run/jump/climb/hurt/dead/teleport/victory
    this.onGround = false;
    this.wasGround = false;

    this.invul = 0;
    this.hurtTimer = 0;
    this.animT = 0;
    this.runFrame = 0;
    this.shootTimer = 0;     // 撃った直後の腕を出すポーズ
    this.charge = 0;
    this.chargeSfx = false;

    this.controlEnabled = true;
    this.dead = false;
    this.deathTimer = 0;

    this.onIce = false;
    this.climbing = false;
    this.ladderX = 0;

    /* --- 武器 --- */
    this.weapons = ['buster'];     // 所持している武器ID
    this.weaponIndex = 0;
    this.ammo = {};
    for (var i = 0; i < W.WEAPONS.length; i++) this.ammo[W.WEAPONS[i].id] = MAX_AMMO;

    this.teleportY = -60;          // 登場演出用
  }

  Player.MAX_HP = MAX_HP;
  Player.MAX_AMMO = MAX_AMMO;

  var P = Player.prototype;

  P.hitbox = function () { return { x: this.x, y: this.y, w: this.w, h: this.h }; };
  P.cx = function () { return this.x + this.w / 2; };
  P.cy = function () { return this.y + this.h / 2; };
  P.weaponId = function () { return this.weapons[this.weaponIndex]; };
  P.weaponDef = function () { return W.BY_ID[this.weaponId()]; };

  /* 弾の出る位置（バスターの銃口） */
  P.muzzle = function () {
    return { x: this.cx() + this.face * 11, y: this.y + 11 };
  };

  /* ---------------- 武器の入手と切り替え ---------------- */
  P.giveWeapon = function (id) {
    if (this.weapons.indexOf(id) < 0) this.weapons.push(id);
    this.ammo[id] = MAX_AMMO;
  };
  P.cycleWeapon = function (dir) {
    if (this.weapons.length < 2) { A.sfx.deny(); return false; }
    this.weaponIndex = (this.weaponIndex + (dir || 1) + this.weapons.length) % this.weapons.length;
    A.sfx.weaponSwitch();
    G.fx.burst(this.cx(), this.cy(), 10, {
      speed: 1.8, life: 16, size: 2, color: this.weaponDef().color, light: true });
    return true;
  };
  P.selectWeapon = function (idx) {
    if (idx >= 0 && idx < this.weapons.length) {
      this.weaponIndex = idx;
      A.sfx.weaponSwitch();
    }
  };

  /* ---------------- ダメージ ---------------- */
  P.damage = function (amount, fromX) {
    if (this.invul > 0 || this.state === 'dead' || this.state === 'teleport') return false;
    this.hp -= amount;
    if (this.hp <= 0) { this.hp = 0; this.die(); return true; }

    this.invul = INVUL;
    this.hurtTimer = HURT_TIME;
    this.state = 'hurt';
    this.climbing = false;
    // 攻撃を受けた側と逆方向に軽くノックバック
    var dir = (fromX === undefined) ? -this.face : (this.cx() < fromX ? -1 : 1);
    this.vx = dir * 1.05;
    this.vy = -1.15;
    this.cancelCharge();

    A.sfx.hurt();
    G.fx.flash('#F87858', 6, 0.42);
    G.fx.shake(3, 14);
    G.fx.burst(this.cx(), this.cy(), 8, { speed: 2, life: 16, size: 2, color: '#F87858' });
    return true;
  };

  P.die = function () {
    if (this.state === 'dead') return;
    this.state = 'dead';
    this.deathTimer = 0;
    this.cancelCharge();
    A.sfx.death();
    // 原作の「8方向に飛び散る」やられ演出
    for (var i = 0; i < 8; i++) {
      var a = (i / 8) * Math.PI * 2;
      G.fx.part({
        x: this.cx(), y: this.cy(),
        vx: Math.cos(a) * 2.2, vy: Math.sin(a) * 2.2,
        life: 70, size: 4, color: '#BCE8FC', color2: '#0058F8',
        type: 'circle', light: true, shrink: false, drag: 1
      });
      G.fx.part({
        x: this.cx(), y: this.cy(),
        vx: Math.cos(a) * 1.1, vy: Math.sin(a) * 1.1,
        life: 70, size: 3, color: '#FCFCFC', color2: '#3CBCFC',
        type: 'circle', light: true, shrink: false, drag: 1
      });
    }
    G.fx.flash('#FCFCFC', 5, 0.5);
  };

  P.cancelCharge = function () {
    this.charge = 0;
    if (this.chargeSfx) { A.chargeStop(); this.chargeSfx = false; }
  };

  P.chargeLevel = function () {
    if (this.charge >= CHARGE_2) return 2;
    if (this.charge >= CHARGE_1) return 1;
    return 0;
  };

  /* ---------------- 登場演出（上からビームで降りてくる） ---------------- */
  P.startTeleport = function () {
    this.state = 'teleport';
    this.teleportY = -70;
    this.controlEnabled = false;
    A.sfx.teleportIn();
  };

  /* ======================================================================
     毎フレーム更新
     ====================================================================== */
  P.update = function (st) {
    var inp = G.input;

    /* --- やられ中：しばらく待ってからステージ側が処理する --- */
    if (this.state === 'dead') {
      this.deathTimer++;
      return;
    }

    /* --- 登場（テレポート）演出 --- */
    if (this.state === 'teleport') {
      this.teleportY += 9;
      if (this.teleportY >= 0) {
        this.teleportY = 0;
        this.state = 'idle';
        this.controlEnabled = true;
        this.vy = 0;
        A.sfx.land2();
        G.fx.dust(this.cx() - 5, this.y + this.h, -1);
        G.fx.dust(this.cx() + 5, this.y + this.h, 1);
        G.fx.ring(this.cx(), this.y + this.h, 2, 22, 12, '#BCE8FC');
      }
      return;
    }

    this.animT++;
    if (this.invul > 0) this.invul--;
    if (this.shootTimer > 0) this.shootTimer--;

    var canAct = this.controlEnabled && this.hurtTimer <= 0;

    /* --- のけぞり中 --- */
    if (this.hurtTimer > 0) {
      this.hurtTimer--;
      if (this.hurtTimer === 0 && this.state === 'hurt') this.state = 'idle';
    }

    /* ================= はしご ================= */
    var onLadder = TL.boxLadder(this.x + 3, this.y, this.w - 6, this.h);
    var ladderBelow = TL.boxLadder(this.x + 3, this.y + this.h, this.w - 6, 4);

    if (this.climbing) {
      // はしごから外れたら通常状態へ
      if (!onLadder && !ladderBelow) this.climbing = false;
    } else if (canAct && onLadder && (inp.held.up || (inp.held.down && !this.onGround))) {
      this.climbing = true;
      this.vx = 0; this.vy = 0;
      // はしごの中心にスナップ
      var tx = Math.floor(this.cx() / TL.T);
      this.x = tx * TL.T + TL.T / 2 - this.w / 2;
    } else if (canAct && this.onGround && inp.held.down && ladderBelow && !onLadder) {
      // 上に乗ったはしごから降りる
      this.climbing = true;
      this.y += 4;
      var tx2 = Math.floor(this.cx() / TL.T);
      this.x = tx2 * TL.T + TL.T / 2 - this.w / 2;
    }

    if (this.climbing) {
      this.state = 'climb';
      this.vy = 0;
      if (canAct) {
        if (inp.held.up)   { this.vy = -CLIMB_SP; }
        else if (inp.held.down) { this.vy = CLIMB_SP; }
        // はしごの途中でジャンプすると降りられる
        if (inp.pressed.jump) {
          this.climbing = false;
          this.vy = 0;
          this.state = 'jump';
        }
      }
      if (this.climbing) {
        if (this.vy !== 0) this.animT++;
        TL.moveY(this, this.vy);
        // 一番上まで登り切ったら地面に立つ
        if (!TL.boxLadder(this.x + 3, this.y + this.h - 2, this.w - 6, 4)) {
          if (this.vy < 0) {
            this.climbing = false;
            this.state = 'idle';
            this.vy = 0;
          }
        }
        if (TL.onGround(this) && this.vy > 0) { this.climbing = false; this.state = 'idle'; }
        this.handleShooting(st, canAct);
        this.postUpdate(st);
        return;
      }
    }

    /* ================= 横移動 ================= */
    this.onIce = TL.boxSlippery(this.x, this.y + this.h, this.w, 2);

    if (canAct) {
      var ax = 0;
      if (inp.held.left)  ax = -1;
      if (inp.held.right) ax = 1;
      // スティックを倒した量が小さくても最低限動く（原作はデジタル入力なので）
      if (ax !== 0) this.face = ax;

      if (this.onIce && this.onGround) {
        // 氷：じわっと加速してなかなか止まらない
        if (ax !== 0) this.vx = U.clamp(this.vx + ax * ICE_ACCEL, -WALK, WALK);
        else this.vx *= ICE_FRIC;
        if (Math.abs(this.vx) < 0.02) this.vx = 0;
      } else {
        // 空中では少し速く動けるので、ジャンプの飛距離が伸びる
        this.vx = ax * (this.onGround ? WALK : AIR);
      }
    } else if (this.hurtTimer > 0) {
      this.vx *= 0.94;   // のけぞりは徐々に減速
    }

    /* ================= ジャンプ ================= */
    if (canAct && inp.pressed.jump && this.onGround) {
      this.vy = JUMP_V;
      this.onGround = false;
      this.state = 'jump';
      A.sfx.jump();
      G.fx.dust(this.cx(), this.y + this.h, 0);
    }
    // ボタンを離したら上昇を打ち切る＝ジャンプの高さを調整できる
    if (!inp.held.jump && this.vy < -1.6) this.vy = -1.6;

    /* ================= 重力 ================= */
    this.vy = Math.min(this.vy + GRAV, MAX_FALL);

    /* ================= 移動の適用 ================= */
    TL.moveX(this, this.vx);
    this.wasGround = this.onGround;
    var hitY = TL.moveY(this, this.vy);
    this.onGround = (hitY === 1) || TL.onGround(this);

    // 着地した瞬間の演出
    if (this.onGround && !this.wasGround) {
      if (this.state === 'jump' || this.state === 'hurt') {
        A.sfx.land();
        G.fx.dust(this.cx() - 4, this.y + this.h, -1);
        G.fx.dust(this.cx() + 4, this.y + this.h, 1);
      }
      if (this.hurtTimer <= 0) this.state = 'idle';
    }

    /* ================= 状態の決定 ================= */
    if (this.hurtTimer > 0) this.state = 'hurt';
    else if (!this.onGround) this.state = 'jump';
    else if (Math.abs(this.vx) > 0.1) this.state = 'run';
    else this.state = 'idle';

    /* ================= 走行アニメ ================= */
    if (this.state === 'run') {
      if (this.animT % 7 === 0) {
        this.runFrame = (this.runFrame + 1) % 3;
        // 走行中の足元の砂ぼこり
        if (this.runFrame === 0) G.fx.dust(this.cx() - this.face * 4, this.y + this.h, -this.face * 0.5);
      }
    } else this.runFrame = 0;

    this.handleShooting(st, canAct);
    this.postUpdate(st);
  };

  /* ---------------- ショットとチャージ ---------------- */
  P.handleShooting = function (st, canAct) {
    var inp = G.input;
    var def = this.weaponDef();

    if (!canAct) { this.cancelCharge(); return; }

    // --- チャージできる武器（バスター）だけ長押しを溜める ---
    if (def.charge) {
      if (inp.held.shot) {
        this.charge++;
        if (this.charge === CHARGE_1) { A.sfx.chargeTick(); A.chargeStart(); this.chargeSfx = true; }
        if (this.charge === CHARGE_2) { A.sfx.chargeMax(); }
        if (this.chargeSfx) {
          A.chargeLevel(U.clamp((this.charge - CHARGE_1) / (CHARGE_2 - CHARGE_1), 0, 1));
        }
        // 溜め中のオーラ
        var lv = this.chargeLevel();
        if (lv > 0 && this.animT % (lv === 2 ? 2 : 4) === 0) {
          var a = U.rnd() * Math.PI * 2, r = 18 + U.rnd() * 8;
          G.fx.part({
            x: this.cx() + Math.cos(a) * r, y: this.cy() + Math.sin(a) * r,
            vx: -Math.cos(a) * 1.5, vy: -Math.sin(a) * 1.5,
            life: 12, size: lv === 2 ? 3 : 2,
            color: lv === 2 ? '#FCFCFC' : '#3CBCFC', color2: '#0058F8',
            type: 'circle', light: true
          });
        }
      }
      // 離した瞬間に発射（溜まっていれば強い弾）
      if (inp.released.shot) {
        var level = this.chargeLevel();
        if (W.fire(this, st, 'buster', level)) this.shootTimer = 16;
        this.cancelCharge();
      }
    } else {
      // チャージ非対応の武器は押した瞬間に発射
      if (inp.pressed.shot) {
        if (W.fire(this, st, this.weaponId(), 0)) this.shootTimer = 16;
      }
      this.charge = 0;
    }

    // --- 武器切り替え ---
    if (inp.pressed.weapon) this.cycleWeapon(1);
  };

  /* ---------------- 移動後の共通処理（トゲ・落下死） ---------------- */
  P.postUpdate = function (st) {
    // トゲに触れたら即死（原作準拠）
    if (TL.boxHazard(this.x + 2, this.y + 2, this.w - 4, this.h - 4)) {
      this.hp = 0;
      this.die();
      return;
    }
    // 穴に落ちた
    var lv = TL.getLevel();
    if (lv && this.y > lv.pxH + 24) {
      this.hp = 0;
      this.die();
    }
  };

  /* ======================================================================
     描画
     ====================================================================== */
  P.draw = function (camX, camY) {
    var sp = G.sprites.player;
    var ctx = gfx.ctx;

    /* --- テレポート降下中：光の柱 --- */
    if (this.state === 'teleport') {
      var bx = this.cx() - camX;
      var by = this.y + this.h - camY;
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      // 上から降りてくるビーム
      gfx.rect(bx - 3, by + this.teleportY - 40, 6, 40, '#3CBCFC');
      gfx.rect(bx - 1, by + this.teleportY - 44, 2, 44, '#FCFCFC');
      ctx.restore();
      return;
    }

    if (this.state === 'dead') return;   // やられ演出はパーティクルだけ

    // 無敵中は点滅（2フレームごと）
    if (this.invul > 0 && (this.invul % 4 < 2)) return;

    var f = this.face;
    var box, frame;
    if (this.state === 'climb') {
      box = sp.climb[Math.floor(this.animT / 8) % 2];
    } else if (this.state === 'hurt') {
      box = sp.hurt;
    } else if (this.state === 'jump') {
      box = sp.jump;
    } else if (this.state === 'run') {
      box = sp.run[this.runFrame];
    } else if (this.state === 'victory') {
      box = sp.idle;
    } else {
      box = sp.idle;
    }

    var dx = Math.round(this.cx() - camX - box.w / 2);
    var dy = Math.round(this.y - camY);

    /* --- チャージ中は青白く発光 --- */
    var lv = this.chargeLevel();
    if (lv > 0) {
      var glow = (this.animT % 6 < 3);
      if (glow) {
        ctx.save();
        ctx.globalAlpha = lv === 2 ? 0.85 : 0.5;
        ctx.globalCompositeOperation = 'lighter';
        ctx.drawImage(box.sil(lv === 2 ? '#FCFCFC' : '#3CBCFC', f), dx, dy);
        ctx.restore();
      }
    }

    ctx.drawImage(box.get(f), dx, dy);

    /* --- 撃った直後はバスターの腕を重ねて描く --- */
    if (this.shootTimer > 0 && this.state !== 'climb') {
      var bu = sp.buster;
      var bx2 = Math.round(this.cx() - camX + (f > 0 ? 4 : -4 - bu.w));
      var by2 = Math.round(this.y - camY + 8);
      ctx.drawImage(bu.get(f), bx2, by2);
      // 発射直後の銃口フラッシュ
      if (this.shootTimer > 12) {
        ctx.save(); ctx.globalCompositeOperation = 'lighter';
        gfx.circle(this.cx() - camX + f * 14, this.y - camY + 11, 4, '#BCE8FC');
        ctx.restore();
      }
    }

    /* --- 勝利ポーズ：腕を上げる --- */
    if (this.state === 'victory') {
      var au = sp.armUp;
      ctx.drawImage(au.get(f), Math.round(this.cx() - camX + (f > 0 ? 3 : -3 - au.w)),
                    Math.round(this.y - camY - 2));
    }
  };

  return Player;
})();


/* ===== src/game/enemies.js ===== */
/* =========================================================================
   enemies.js  --  雑魚敵

   共通インターフェース:
     update(st) / draw(camX,camY) / hitbox() / damage(n, element, st)
     hp / dead / contactDmg / invulnerable

   敵を追加するときは Enemy を継承して TYPES に登録するだけ。
   ========================================================================= */
G.enemies = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio, TL = G.tiles, W = G.weapons;

  /* ======================================================================
     共通ベース
     ====================================================================== */
  function Enemy(x, y, opt) {
    opt = opt || {};
    this.x = x; this.y = y;
    this.w = 16; this.h = 16;
    this.vx = 0; this.vy = 0;
    this.hp = opt.hp || 2;
    this.maxHp = this.hp;
    this.contactDmg = opt.contactDmg || 3;
    this.dead = false;
    this.face = -1;
    this.age = 0;
    this.flash = 0;          // 被弾時の白フラッシュ
    this.frozen = 0;         // アイススラッシャーで凍結
    this.invulnerable = false;
    this.dropChance = opt.dropChance === undefined ? 0.34 : opt.dropChance;
    this.gravity = 0;
    this.spawner = null;     // 復活管理用（stage 側が入れる）
  }
  var E = Enemy.prototype;

  E.hitbox = function () { return { x: this.x, y: this.y, w: this.w, h: this.h }; };
  E.cx = function () { return this.x + this.w / 2; };
  E.cy = function () { return this.y + this.h / 2; };

  E.damage = function (n, element, st) {
    if (this.invulnerable || this.dead) return false;
    this.hp -= n;
    this.flash = 5;
    if (this.hp <= 0) { this.kill(st); return true; }
    A.sfx.hit();
    return true;
  };

  E.freezeMe = function (frames) {
    if (this.noFreeze) return;
    this.frozen = frames;
    A.sfx.freeze();
  };

  E.kill = function (st) {
    if (this.dead) return;
    this.dead = true;
    A.sfx.enemyPop();
    G.fx.explode(this.cx(), this.cy(), 0.9);
    if (st && U.rnd() < this.dropChance) st.dropItem(this.cx(), this.cy());
  };

  // 共通の物理（重力＋地形）。使うかは各敵の実装しだい
  E.physics = function () {
    if (this.gravity) {
      this.vy = Math.min(this.vy + this.gravity, 7);
      TL.moveX(this, this.vx);
      var r = TL.moveY(this, this.vy);
      this.onGround = (r === 1);
    } else {
      this.x += this.vx; this.y += this.vy;
    }
  };

  // 凍結中の氷ブロック描画（共通）
  E.drawFrozen = function (camX, camY) {
    var x = this.x - camX, y = this.y - camY;
    var ctx = gfx.ctx;
    ctx.save();
    ctx.globalAlpha = 0.62;
    gfx.rect(x - 2, y - 2, this.w + 4, this.h + 4, '#BCE8FC');
    gfx.rect(x - 1, y - 1, this.w + 2, this.h + 2, '#3CBCFC');
    ctx.globalAlpha = 0.9;
    gfx.rect(x + 1, y + 1, 3, this.h - 4, '#FCFCFC');
    ctx.restore();
  };

  // スプライトを描く（被弾フラッシュ・凍結を考慮した共通処理）
  E.blit = function (box, camX, camY, ox, oy) {
    var ctx = gfx.ctx;
    var dx = Math.round(this.cx() - camX - box.w / 2 + (ox || 0));
    var dy = Math.round(this.y + this.h - box.h - camY + (oy || 0));
    if (this.flash > 0) {
      ctx.drawImage(box.sil('#FCFCFC', this.face), dx, dy);
    } else {
      ctx.drawImage(box.get(this.face), dx, dy);
    }
    if (this.frozen > 0) this.drawFrozen(camX, camY);
  };

  E.preUpdate = function () {
    this.age++;
    if (this.flash > 0) this.flash--;
    if (this.frozen > 0) { this.frozen--; return true; }   // true = 凍って動けない
    return false;
  };

  function extend(Ctor) {
    Ctor.prototype = Object.create(E);
    Ctor.prototype.constructor = Ctor;
    return Ctor;
  }

  /* ======================================================================
     ① メットール風：普段はヘルメットで無敵、開いた時だけ攻撃＆被弾
     ====================================================================== */
  var Met = extend(function (x, y) {
    Enemy.call(this, x, y, { hp: 1, contactDmg: 3 });
    this.w = 16; this.h = 14;
    this.mode = 'hide';
    this.timer = 0;
    this.gravity = 0.3;
    this.invulnerable = true;
    this.shotsLeft = 0;
  });
  Met.prototype.update = function (st) {
    if (this.preUpdate()) return;
    var pl = st.player;
    var dx = pl.cx() - this.cx();
    this.face = dx < 0 ? -1 : 1;
    this.vx = 0;
    this.timer++;

    if (this.mode === 'hide') {
      this.invulnerable = true;
      // プレイヤーが近づいたら顔を出す
      if (Math.abs(dx) < 96 && Math.abs(pl.cy() - this.cy()) < 56 && this.timer > 34) {
        this.mode = 'open'; this.timer = 0; this.shotsLeft = 3;
      }
    } else if (this.mode === 'open') {
      this.invulnerable = false;
      if (this.timer === 16) {
        // 3方向に弾を撃つ
        var sp = 2.6;
        [-0.32, 0, 0.32].forEach(function (a) {
          st.shots.push(new W.EnemyShot(this.cx(), this.cy() - 2,
            Math.cos(a) * sp * this.face, Math.sin(Math.abs(a)) * sp * 0.9,
            { dmg: 3, color: '#F8D878', color2: '#FCFCFC', size: 8 }));
        }, this);
        A.sfx.shot();
      }
      if (this.timer > 34 && this.timer < 86) {
        this.vx = this.face * 0.42;   // てくてく歩く
      }
      if (this.timer > 100) { this.mode = 'hide'; this.timer = 0; }
    }
    this.physics();
  };
  Met.prototype.draw = function (camX, camY) {
    var s = G.sprites.enemy.met;
    this.blit(this.mode === 'open' ? s[0] : s[1], camX, camY);
  };

  /* ======================================================================
     ② 飛行敵：上下に波打ちながら突っ込んでくる
     ====================================================================== */
  var Flyer = extend(function (x, y, opt) {
    Enemy.call(this, x, y, { hp: 2, contactDmg: 4 });
    this.w = 16; this.h = 10;
    this.baseY = y;
    this.speed = (opt && opt.speed) || 1.5;
    this.amp = (opt && opt.amp) || 22;
    this.dirSet = false;
  });
  Flyer.prototype.update = function (st) {
    if (this.preUpdate()) return;
    if (!this.dirSet) {
      this.face = st.player.cx() < this.cx() ? -1 : 1;
      this.dirSet = true;
    }
    this.x += this.face * this.speed;
    this.y = this.baseY + Math.sin(this.age * 0.075) * this.amp;
    // 排気の粒
    if (this.age % 5 === 0) {
      G.fx.part({ x: this.cx() - this.face * 8, y: this.cy() + 2,
        vx: -this.face * 0.5, vy: 0.1, life: 10, size: 2, color: '#FC9838', light: true });
    }
  };
  Flyer.prototype.draw = function (camX, camY) {
    var s = G.sprites.enemy.fly;
    this.blit(s[Math.floor(this.age / 5) % 2], camX, camY);
  };

  /* ======================================================================
     ③ 砲台：一定間隔で狙い撃ち（撃つ前に光って予告）
     ====================================================================== */
  var Turret = extend(function (x, y) {
    Enemy.call(this, x, y, { hp: 4, contactDmg: 3 });
    this.w = 12; this.h = 12;
    this.timer = U.rndInt(0, 60);
  });
  Turret.prototype.update = function (st) {
    if (this.preUpdate()) return;
    this.timer++;
    var pl = st.player;
    this.face = pl.cx() < this.cx() ? -1 : 1;
    if (this.timer === 92) A.sfx.blip();
    if (this.timer >= 110) {
      this.timer = 0;
      var a = Math.atan2(pl.cy() - this.cy(), pl.cx() - this.cx());
      st.shots.push(new W.EnemyShot(this.cx(), this.cy(),
        Math.cos(a) * 3.1, Math.sin(a) * 3.1,
        { dmg: 3, color: '#F878F8', color2: '#FCFCFC', size: 8, style: 'ball' }));
      A.sfx.shot();
      G.fx.burst(this.cx() + Math.cos(a) * 8, this.cy() + Math.sin(a) * 8, 4,
        { speed: 1.2, life: 8, size: 2, color: '#F878F8', light: true });
    }
  };
  Turret.prototype.draw = function (camX, camY) {
    var s = G.sprites.enemy.turret;
    // 発射直前は色が変わる（予告）
    this.blit(this.timer > 92 ? s[1] : s[0], camX, camY);
  };

  /* ======================================================================
     ④ 跳ねる敵：プレイヤーの方へジャンプで詰めてくる
     ====================================================================== */
  var Hopper = extend(function (x, y) {
    Enemy.call(this, x, y, { hp: 3, contactDmg: 4 });
    this.w = 14; this.h = 11;
    this.gravity = 0.28;
    this.timer = U.rndInt(0, 40);
    this.onGround = false;
  });
  Hopper.prototype.update = function (st) {
    if (this.preUpdate()) { this.physics(); return; }
    this.timer++;
    if (this.onGround) {
      this.vx = 0;
      if (this.timer > 48) {
        this.timer = 0;
        this.face = st.player.cx() < this.cx() ? -1 : 1;
        this.vy = -4.3;
        this.vx = this.face * 1.35;
        A.sfx.jump();
      }
    }
    this.physics();
    if (this.onGround && this.vy === 0 && this.age % 30 === 0) {
      G.fx.dust(this.cx(), this.y + this.h, 0);
    }
  };
  Hopper.prototype.draw = function (camX, camY) {
    var s = G.sprites.enemy.hop;
    this.blit(this.onGround ? s[1] : s[0], camX, camY);
  };

  /* ======================================================================
     ⑤ 転がる棘：床を転がって往復。凍らない、接触ダメージ大
     ====================================================================== */
  var Spiker = extend(function (x, y, opt) {
    Enemy.call(this, x, y, { hp: 5, contactDmg: 6 });
    this.w = 13; this.h = 9;
    this.gravity = 0.3;
    this.face = (opt && opt.dir) || -1;
    this.noFreeze = true;
    this.spin = 0;
  });
  Spiker.prototype.update = function (st) {
    if (this.preUpdate()) { this.physics(); return; }
    this.vx = this.face * 1.25;
    this.spin += this.face * 0.2;
    var hit = TL.moveX(this, this.vx);
    if (hit !== 0) this.face = -this.face;
    // 崖の縁で折り返す
    if (this.onGround && !TL.boxSolid(this.x + (this.face > 0 ? this.w : -2), this.y + this.h + 2, 2, 2)) {
      this.face = -this.face;
    }
    this.vy = Math.min(this.vy + this.gravity, 7);
    var r = TL.moveY(this, this.vy);
    this.onGround = (r === 1);
    if (this.age % 8 === 0) G.fx.dust(this.cx(), this.y + this.h, -this.face * 0.4);
  };
  Spiker.prototype.draw = function (camX, camY) {
    var box = G.sprites.enemy.spike[0];
    var ctx = gfx.ctx;
    ctx.save();
    ctx.translate(Math.round(this.cx() - camX), Math.round(this.cy() - camY));
    ctx.rotate(this.spin);
    var img = this.flash > 0 ? box.sil('#FCFCFC', 1) : box.r;
    ctx.drawImage(img, -box.w / 2 | 0, -box.h / 2 | 0);
    ctx.restore();
  };

  /* ======================================================================
     ⑥ 浮遊する足場（敵ではないが同じ枠で動かすと楽）
     ====================================================================== */
  var Platform = extend(function (x, y, opt) {
    Enemy.call(this, x, y, { hp: 999, contactDmg: 0 });
    opt = opt || {};
    this.w = opt.w || 32; this.h = 8;
    this.invulnerable = true;
    this.noFreeze = true;
    this.isPlatform = true;
    this.ax = opt.ax || 0;      // 横の振幅
    this.ay = opt.ay || 40;     // 縦の振幅
    this.spd = opt.spd || 0.012;
    this.ox = x; this.oy = y;
    this.prevX = x; this.prevY = y;
  });
  Platform.prototype.update = function () {
    this.age++;
    this.prevX = this.x; this.prevY = this.y;
    this.x = this.ox + Math.sin(this.age * this.spd) * this.ax;
    this.y = this.oy + Math.sin(this.age * this.spd) * this.ay;
  };
  Platform.prototype.damage = function () { return false; };
  Platform.prototype.draw = function (camX, camY) {
    var x = Math.round(this.x - camX), y = Math.round(this.y - camY);
    gfx.rect(x, y, this.w, this.h, '#101018');
    gfx.rect(x + 1, y + 1, this.w - 2, this.h - 2, '#7C7C7C');
    gfx.rect(x + 1, y + 1, this.w - 2, 2, '#BCBCBC');
    gfx.rect(x + 1, y + this.h - 2, this.w - 2, 1, '#2C2C2C');
    // 噴射
    for (var i = 6; i < this.w - 4; i += 10) {
      gfx.rect(x + i, y + this.h, 3, 2 + (this.age % 6 < 3 ? 1 : 0), '#FC9838');
    }
  };

  /* ======================================================================
     生成のための表
     ====================================================================== */
  var TYPES = {
    met: Met, fly: Flyer, turret: Turret, hop: Hopper, spike: Spiker, plat: Platform
  };

  function create(type, x, y, opt) {
    var C = TYPES[type];
    if (!C) return null;
    return new C(x, y, opt);
  }

  return {
    Enemy: Enemy, extend: extend, create: create, TYPES: TYPES,
    Met: Met, Flyer: Flyer, Turret: Turret, Hopper: Hopper, Spiker: Spiker, Platform: Platform
  };
})();


/* ===== src/game/bosses.js ===== */
/* =========================================================================
   bosses.js  --  ボス6体

   共通の流れ:
     entrance（落下 or スライドイン）→ pose（名前表示中の待機）
       → loop: wait → telegraph（予備動作）→ attack → recover
     HP が半分を切ると enraged = true になり、行動が速く・激しくなる。

   弱点は輪になっている（どのボスから始めても攻略可能）:
     ガッツ ← ボム ← ファイアー ← アイス ← エレック ← カッター ← ガッツ
   ========================================================================= */
G.bosses = (function () {
  'use strict';
  var gfx = G.gfx, U = G.util, A = G.audio, TL = G.tiles, W = G.weapons;

  var MAX_HP = 28;
  var WEAK_MULT = 3;      // 弱点武器のダメージ倍率

  /* ======================================================================
     汎用ハザード（雷柱・ビーム・氷の壁・衝撃波などに使う矩形の攻撃判定）
     ====================================================================== */
  function Hazard(x, y, w, h, opt) {
    opt = opt || {};
    this.x = x; this.y = y; this.w = w; this.h = h;
    this.vx = opt.vx || 0; this.vy = opt.vy || 0;
    this.dmg = opt.dmg || 4;
    this.team = 'enemy';
    this.element = opt.element || 'enemy';
    this.life = opt.life || 60;
    this.age = 0;
    this.dead = false;
    this.pierce = true;
    this.warn = opt.warn || 0;        // 予告フレーム数（この間は判定なし）
    this.drawFn = opt.draw || null;
    this.color = opt.color || '#F8D878';
    this.stickFloor = opt.stickFloor || false;
    this.onStep = opt.onStep || null;
  }
  Hazard.prototype.hitbox = function () {
    // 予告中は当たり判定を出さない（理不尽にしないため）
    if (this.age < this.warn) return { x: -9999, y: -9999, w: 0, h: 0 };
    return { x: this.x, y: this.y, w: this.w, h: this.h };
  };
  Hazard.prototype.cx = function () { return this.x + this.w / 2; };
  Hazard.prototype.cy = function () { return this.y + this.h / 2; };
  Hazard.prototype.onHit = function () { return false; };
  Hazard.prototype.update = function (st) {
    this.age++;
    this.x += this.vx; this.y += this.vy;
    if (this.onStep) this.onStep(this, st);
    if (--this.life <= 0) this.dead = true;
  };
  Hazard.prototype.draw = function (cx, cy) {
    if (this.drawFn) { this.drawFn(this, cx, cy); return; }
    var a = this.age < this.warn ? 0.35 : 1;
    var ctx = gfx.ctx;
    ctx.save(); ctx.globalAlpha = a;
    gfx.rect(this.x - cx, this.y - cy, this.w, this.h, this.color);
    ctx.restore();
  };

  /* ======================================================================
     ボス共通ベース
     ====================================================================== */
  function Boss(def, x, y) {
    this.def = def;
    this.id = def.id;
    this.name = def.name;
    this.col = def.col;
    this.weakness = def.weakness;
    this.drop = def.drop;

    this.w = 24; this.h = 30;
    this.x = x - this.w / 2;
    this.y = y - this.h;
    this.homeX = x; this.homeY = y;
    this.vx = 0; this.vy = 0;
    this.face = -1;

    this.hp = MAX_HP;
    this.maxHp = MAX_HP;
    this.contactDmg = 5;

    this.state = 'entrance';
    this.act = 'wait';
    this.actT = 0;
    this.lastAct = '';
    this.age = 0;
    this.flash = 0;
    this.invul = 0;
    this.enraged = false;
    this.dead = false;
    this.defeated = false;
    this.dyingT = 0;
    this.frozen = 0;
    this.onGround = false;
    this.active = false;        // 名前表示が終わるまでは動かない

    this.pose = { lean: 0, armL: 0, armR: 0, crouch: 0, legSpread: 4, headY: 0 };
    this.arena = null;          // { x0, x1, floorY } をステージが入れる
    this.entranceT = 0;
    this.entranceType = def.entrance || 'drop';
  }
  var B = Boss.prototype;

  B.hitbox = function () { return { x: this.x + 2, y: this.y + 2, w: this.w - 4, h: this.h - 2 }; };
  B.cx = function () { return this.x + this.w / 2; };
  B.cy = function () { return this.y + this.h / 2; };
  B.feetY = function () { return this.y + this.h; };

  /* ---------------- ダメージ ---------------- */
  B.damage = function (n, element, st) {
    if (this.invul > 0 || this.state === 'dying' || this.state === 'entrance' || !this.active) return false;
    var dmg = n;
    var isWeak = (element === this.weakness);
    if (isWeak) dmg = n * WEAK_MULT;
    if (element === 'buster' && this.def.busterResist) dmg = Math.max(1, Math.floor(dmg * 0.5));

    this.hp -= dmg;
    this.flash = 6;
    this.invul = 12;            // 連続ヒットしすぎないように短い無敵

    if (isWeak) {
      A.sfx.bossHurt();
      G.fx.burst(this.cx(), this.cy(), 10, { speed: 2.4, life: 18, size: 3,
        color: '#FCFCFC', color2: this.col.main, light: true });
      G.fx.shake(2, 8);
    } else {
      A.sfx.bossHurt();
      G.fx.burst(this.cx(), this.cy(), 5, { speed: 1.6, life: 12, size: 2, color: '#FCFCFC' });
    }

    // --- 半減で強化モードへ ---
    if (!this.enraged && this.hp <= this.maxHp / 2 && this.hp > 0) {
      this.enraged = true;
      this.onEnrage(st);
    }

    if (this.hp <= 0) { this.hp = 0; this.startDying(st); return true; }
    return true;
  };

  B.onEnrage = function (st) {
    A.sfx.bossWarn();
    G.fx.flash(this.col.main, 8, 0.5);
    G.fx.shake(4, 20);
    G.fx.ring(this.cx(), this.cy(), 4, 46, 20, this.col.light);
    G.fx.burst(this.cx(), this.cy(), 20, { speed: 3, life: 26, size: 3,
      color: this.col.light, color2: this.col.main, light: true });
    this.act = 'wait'; this.actT = 30;
  };

  /* ---------------- 撃破演出 ---------------- */
  B.startDying = function (st) {
    this.state = 'dying';
    this.dyingT = 0;
    this.vx = 0;
    A.sfx.explode();
    G.fx.slowmo(0.35, 44);        // 少しスローに
    G.fx.shake(3, 30);
    if (st) st.onBossDying();
  };

  B.updateDying = function (st) {
    this.dyingT++;
    var t = this.dyingT;
    // ゆっくり点滅しながら小爆発を繰り返す
    if (t < 100 && t % 7 === 0) {
      var a = U.rnd() * Math.PI * 2, r = U.rnd() * 18;
      G.fx.explode(this.cx() + Math.cos(a) * r, this.cy() + Math.sin(a) * r, 0.7);
      A.sfx.enemyPop();
    }
    // 短い無音の後に大爆発
    if (t === 108) {
      G.fx.explodeBig(this.cx(), this.cy());
      G.fx.explodeBig(this.cx() - 8, this.cy() + 6);
      G.fx.explodeBig(this.cx() + 8, this.cy() - 6);
      A.sfx.explodeBig();
      G.fx.flash('#FCFCFC', 14, 0.95);
      G.fx.shake(6, 40);
      G.fx.slowmo(0.25, 30);
      this.dead = true;
      this.defeated = true;
      if (st) st.onBossDefeated();
    }
  };

  /* ---------------- 登場演出 ---------------- */
  B.updateEntrance = function (st) {
    this.entranceT++;
    var t = this.entranceT;

    if (this.entranceType === 'drop') {
      // 天井から落ちてきて着地で衝撃
      if (t < 6) { this.y = this.homeY - this.h - 200; }
      this.vy = Math.min(this.vy + 0.75, 13);
      this.y += this.vy;
      if (this.feetY() >= this.arena.floorY) {
        this.y = this.arena.floorY - this.h;
        this.vy = 0;
        this.state = 'pose';
        this.actT = 0;
        A.sfx.bossStep();
        G.fx.shake(5, 22);
        G.fx.ring(this.cx(), this.feetY(), 4, 50, 18, this.col.light);
        G.fx.dust(this.cx() - 10, this.feetY(), -1.6);
        G.fx.dust(this.cx() + 10, this.feetY(), 1.6);
        G.fx.burst(this.cx(), this.feetY(), 12, { speed: 2.6, life: 22, size: 3,
          color: '#BCBCBC', dir: -Math.PI / 2, spread: Math.PI });
      }
    } else {
      // 横からスライドイン
      if (t === 1) { this.x = this.arena.x1 + 30; this.y = this.arena.floorY - this.h; }
      this.x -= 2.6;
      if (this.age % 6 === 0) G.fx.dust(this.cx(), this.feetY(), 1);
      if (this.x <= this.homeX - this.w / 2) {
        this.x = this.homeX - this.w / 2;
        this.state = 'pose';
        this.actT = 0;
        A.sfx.bossStep();
        G.fx.shake(3, 14);
      }
    }
  };

  /* ---------------- 行動の切り替え ---------------- */
  B.setAct = function (name, dur) {
    this.lastAct = this.act;
    this.act = name;
    this.actT = 0;
    this.actDur = dur;
  };

  /* ---------------- 共通の物理 ---------------- */
  B.physics = function () {
    this.vy = Math.min(this.vy + 0.36, 11);
    this.x += this.vx;
    this.y += this.vy;
    // 床
    if (this.feetY() >= this.arena.floorY) {
      this.y = this.arena.floorY - this.h;
      if (!this.onGround && this.vy > 3) this.onLandHeavy();
      this.vy = 0;
      this.onGround = true;
    } else this.onGround = false;
    // 壁（アリーナの端）
    if (this.x < this.arena.x0) { this.x = this.arena.x0; this.vx = Math.abs(this.vx); }
    if (this.x + this.w > this.arena.x1) { this.x = this.arena.x1 - this.w; this.vx = -Math.abs(this.vx); }
  };
  B.onLandHeavy = function () {
    A.sfx.land2();
    G.fx.dust(this.cx() - 8, this.feetY(), -1);
    G.fx.dust(this.cx() + 8, this.feetY(), 1);
    G.fx.shake(2, 8);
  };

  B.facePlayer = function (st) {
    this.face = st.player.cx() < this.cx() ? -1 : 1;
  };

  /* ---------------- メイン更新 ---------------- */
  B.update = function (st) {
    this.age++;
    if (this.flash > 0) this.flash--;
    if (this.invul > 0) this.invul--;

    if (this.state === 'dying') { this.updateDying(st); return; }
    if (this.state === 'entrance') { this.updateEntrance(st); return; }
    if (this.state === 'pose') {
      // 名前表示の間はポーズを取って待つ
      this.actT++;
      this.pose.armR = -Math.round(Math.sin(this.actT * 0.1) * 2);
      if (this.active) { this.state = 'fight'; this.setAct('wait', 34); }
      return;
    }

    if (this.frozen > 0) { this.frozen--; this.physics(); return; }

    this.actT++;
    this.runAct(st);
    this.physics();
  };

  /* ---------------- 攻撃選択の共通ヘルパ ---------------- */
  B.pickAttack = function (st, list) {
    // 直前と同じ技を続けにくくする

  /* ======================================================================
     一覧（ステージセレクトの並び順もここ）
