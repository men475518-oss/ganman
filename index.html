<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>GANMAN - ロックマン風アクション</title>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#000000">
<style>
  /* ---- 全体：スマホで余計なスクロール/選択/ハイライトを完全に殺す ---- */
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body {
    width:100%; height:100%; overflow:hidden; background:#000;
    -webkit-user-select:none; user-select:none;
    -webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;
    touch-action:none; overscroll-behavior:none;
  }
  body { display:flex; align-items:center; justify-content:center; }

  /* ---- キャンバス：ドット絵を保つため nearest-neighbor 拡大 ---- */
  #screen {
    display:block;
    image-rendering: pixelated;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    background:#000;
    touch-action:none;
  }

  /* ---- 縦持ちのときだけ出る「横にしてね」案内 ---- */
  #rotate {
    position:fixed; inset:0; display:none;
    flex-direction:column; align-items:center; justify-content:center;
    background:#000; color:#3CBCFC; z-index:10;
    font-family:"Courier New",monospace; text-align:center; padding:24px;
  }
  #rotate .ico { font-size:56px; margin-bottom:18px; animation:tilt 1.6s ease-in-out infinite; }
  #rotate b { font-size:17px; letter-spacing:2px; display:block; margin-bottom:8px; color:#FCFCFC; }
  #rotate span { font-size:12px; color:#9CA8B8; line-height:1.8; }
  @keyframes tilt { 0%,100%{transform:rotate(0)} 50%{transform:rotate(-90deg)} }
  body.portrait #rotate { display:flex; }

  /* ---- 起動タップ待ち（iOSは音声をタップ解禁しないと鳴らないため必須） ---- */
  #boot {
    position:fixed; inset:0; display:flex;
    flex-direction:column; align-items:center; justify-content:center;
    background:#000; color:#FCFCFC; z-index:20;
    font-family:"Courier New",monospace; text-align:center; padding:24px;
  }
  #boot .logo { font-size:34px; font-weight:bold; letter-spacing:6px; color:#3CBCFC; text-shadow:0 3px 0 #0058F8; }
  #boot .tap  { margin-top:26px; font-size:14px; letter-spacing:3px; animation:blink 1s steps(2,end) infinite; }
  #boot .note { margin-top:14px; font-size:11px; color:#7C88A0; line-height:1.9; }
  @keyframes blink { 50% { opacity:0 } }
</style>
</head>
<body>
  <canvas id="screen"></canvas>

  <div id="rotate">
    <div class="ico">📱</div>
    <b>PLEASE ROTATE</b>
    <span>横向きにしてください<br>Turn your device sideways</span>
  </div>

  <div id="boot">
    <div class="logo">GANMAN</div>
    <div class="tap">TAP TO START</div>
    <div class="note">タップで起動します<br>（サウンドを有効化）</div>
  </div>

<!-- ================= エンジン ================= -->
<script src="src/core/util.js"></script>
<script src="src/core/gfx.js"></script>
<script src="src/core/input.js"></script>
<script src="src/core/audio.js"></script>
<script src="src/core/music.js"></script>
<script src="src/core/fx.js"></script>
<!-- ================= ゲーム部品 ================= -->
<script src="src/game/sprites.js"></script>
<script src="src/game/tiles.js"></script>
<script src="src/game/stages.js"></script>
<script src="src/game/weapons.js"></script>
<script src="src/game/player.js"></script>
<script src="src/game/enemies.js"></script>
<script src="src/game/bosses.js"></script>
<script src="src/game/items.js"></script>
<script src="src/game/hud.js"></script>
<!-- ================= シーン ================= -->
<script src="src/scenes/title.js"></script>
<script src="src/scenes/select.js"></script>
<script src="src/scenes/stage.js"></script>
<script src="src/scenes/weaponget.js"></script>
<script src="src/scenes/ending.js"></script>
<!-- ================= 起動 ================= -->
<script src="src/main.js"></script>
</body>
</html>
